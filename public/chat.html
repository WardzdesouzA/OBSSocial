<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>OBS Social — Chat ao Vivo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; overflow: hidden; width: 100%; height: 100%; }
  body {
    font-family: var(--font-family, 'Segoe UI', system-ui, sans-serif);
    color: var(--text-color, #fff);
    font-size: var(--font-size, 18px);
  }
  #box {
    position: fixed;
    top: 20px; bottom: 20px;
    width: var(--chat-width, 380px);
    max-width: calc(100vw - 40px);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: var(--spacing, 6px);
    pointer-events: none;
    overflow: hidden;
  }
  body.align-left #box { left: 20px; }
  body.align-right #box { right: 20px; }
  body.dir-top #box { justify-content: flex-start; }

  .msg {
    display: flex;
    gap: 0.45em;
    align-items: flex-start;
    max-width: 100%;
    border-radius: var(--border-radius, 10px);
    transition: opacity 0.6s ease;
  }
  body.style-bubbles .msg {
    background: var(--msg-bg, rgba(17,24,39,0.85));
    padding: 0.4em 0.6em;
  }
  body.style-bubbles.accent-bar .msg {
    border-left: 4px solid var(--msg-accent, transparent);
  }
  body.style-clean .msg { padding: 0.1em 0; }
  body.text-shadow .msg { text-shadow: 0 1px 4px rgba(0,0,0,0.9); }
  .msg.superchat-colored {
    background: color-mix(in srgb, var(--sc-color, #ffb300) 30%, var(--msg-bg, rgba(17,24,39,0.85))) !important;
    border-left-color: var(--sc-color, #ffb300) !important;
  }
  body.style-clean .msg.superchat-colored {
    background: color-mix(in srgb, var(--sc-color, #ffb300) 40%, transparent) !important;
    padding: 0.25em 0.45em;
  }
  .msg.faded { opacity: 0; }

  .avatar {
    width: 1.6em; height: 1.6em; flex-shrink: 0; object-fit: cover; margin-top: 0.1em;
  }
  body.avatar-circle .avatar { border-radius: 50%; }
  body.avatar-rounded .avatar { border-radius: 0.3em; }
  body.avatar-square .avatar { border-radius: 0; }
  .avatar.initials {
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 0.8em;
  }
  .msg .content { min-width: 0; line-height: 1.3; word-wrap: break-word; overflow-wrap: anywhere; }
  .msg .author { font-weight: 700; }
  .msg .author-sep { font-weight: 700; }
  /* 📄 Texto embaixo do nome (igual ao painel ao vivo) */
  body.texto-abaixo .msg .msg-text { display: block; margin-top: 0.1em; }
  /* ✍️ v0.145: as quebras de linha da pessoa também valem no chat fixo */
  .msg .msg-text { white-space: pre-wrap; }
  .msg .msg-text code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.92em; }
  body.texto-abaixo .msg .author-sep { display: none; }
  .msg .badge {
    font-size: 0.7em; background: rgba(255,255,255,0.2); border-radius: 0.35em;
    padding: 0.05em 0.35em; margin-right: 0.25em; vertical-align: 0.1em;
  }
  .msg .sc-amount {
    font-size: 0.8em; font-weight: 800; border-radius: 0.35em; padding: 0.05em 0.4em;
    margin-right: 0.3em; color: #000; vertical-align: 0.05em;
  }
  /* 🏷️ Distintivos com a arte original da plataforma */
  .msg .badge-img {
    background: rgba(255,255,255,0.14); padding: 0.1em 0.2em; line-height: 0;
    display: inline-block;
  }
  .msg .badge-img img { height: 1.05em; width: auto; display: block; }
  .msg .badge-com-arte {
    display: inline-flex; align-items: center; gap: 0.22em;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.28), 0 1px 3px rgba(0,0,0,0.3);
  }
  .msg .badge-com-arte img { height: 1.05em; width: auto; }
  .msg .badge-extra {
    font-weight: 700;
    background: color-mix(in srgb, var(--selo-cor, #fff) 26%, rgba(255,255,255,0.14));
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--selo-cor, #fff) 60%, transparent);
  }
  .msg .badge-role {
    box-shadow: 0 0 0 1px rgba(0,0,0,0.28), 0 1px 3px rgba(0,0,0,0.3);
    text-shadow: 0 1px 1px rgba(0,0,0,0.35);
  }
  .emote { height: 1.35em; vertical-align: middle; }
  .emote.figurinha { height: 3em; max-height: 96px; width: auto; display: inline-block; } /* 🎟️ v0.118 Super Sticker */
  .platform-icon { width: 0.95em; height: 0.95em; vertical-align: -0.1em; margin-right: 0.25em; }

  /* ---------- Animações de entrada das mensagens ----------
     A lista é a MESMA do comentário em destaque e dos widgets: fade,
     slide-up, slide-down, slide-left, slide-right, pop, zoom, bounce,
     flip, spin e blur. "slide" e "slide-side" ficam como apelidos
     antigos, para quem já tinha escolhido antes desta padronização. */
  .anim-slide-up { animation: slideIn var(--in-dur, 0.25s) ease-out; }
  .anim-slide-down { animation: slideInD var(--in-dur, 0.25s) ease-out; }
  @keyframes slideInD { from { opacity: 0; transform: translateY(-14px); } }
  .anim-slide-left { animation: sideInL var(--in-dur, 0.3s) cubic-bezier(0.2, 0.9, 0.3, 1.1); }
  .anim-slide-right { animation: sideInR var(--in-dur, 0.3s) cubic-bezier(0.2, 0.9, 0.3, 1.1); }
  .anim-spin { animation: spinIn var(--in-dur, 0.5s) cubic-bezier(0.2, 0.9, 0.3, 1.1); }
  @keyframes spinIn { from { opacity: 0; transform: rotate(-360deg) scale(0.3); } }
  .anim-slide { animation: slideIn var(--in-dur, 0.25s) ease-out; }
  @keyframes slideIn { from { opacity: 0; transform: translateY(14px); } }
  body.align-right .anim-slide { animation-name: slideInR; }
  @keyframes slideInR { from { opacity: 0; transform: translateX(20px); } }
  .anim-slide-side { animation: sideInL var(--in-dur, 0.3s) cubic-bezier(0.2, 0.9, 0.3, 1.1); }
  @keyframes sideInL { from { opacity: 0; transform: translateX(-40px); } }
  body.align-right .anim-slide-side { animation-name: sideInR; }
  @keyframes sideInR { from { opacity: 0; transform: translateX(40px); } }
  .anim-fade { animation: fadeIn var(--in-dur, 0.35s) ease-out; }
  @keyframes fadeIn { from { opacity: 0; } }
  .anim-pop { animation: popIn var(--in-dur, 0.3s) cubic-bezier(0.2, 1.4, 0.4, 1); }
  @keyframes popIn { from { opacity: 0; transform: scale(0.6); } }
  .anim-zoom { animation: zoomIn var(--in-dur, 0.35s) cubic-bezier(0.2, 0.9, 0.3, 1); }
  @keyframes zoomIn { from { opacity: 0; transform: scale(1.8); } }
  .anim-bounce { animation: bounceIn var(--in-dur, 0.55s) ease-out; }
  @keyframes bounceIn {
    0% { opacity: 0; transform: translateY(-60px); }
    50% { opacity: 1; transform: translateY(0); }
    68% { transform: translateY(-12px); }
    84% { transform: translateY(0); }
    92% { transform: translateY(-5px); }
    100% { transform: translateY(0); }
  }
  .anim-flip { animation: flipIn var(--in-dur, 0.45s) cubic-bezier(0.2, 0.9, 0.3, 1.1); }
  @keyframes flipIn { from { opacity: 0; transform: perspective(600px) rotateX(-90deg); } }
  .anim-blur { animation: blurIn var(--in-dur, 0.45s) ease-out; }
  @keyframes blurIn { from { opacity: 0; filter: blur(10px); } }

  /* ---------- Animações de saída das mensagens ---------- */
  .msg.aout-fade { animation: aoFade var(--out-dur, 0.45s) ease-in forwards; }
  @keyframes aoFade { to { opacity: 0; } }
  .msg.aout-slide-side { animation: aoSideL var(--out-dur, 0.4s) ease-in forwards; }
  @keyframes aoSideL { to { opacity: 0; transform: translateX(-50px); } }
  body.align-right .msg.aout-slide-side { animation-name: aoSideR; }
  @keyframes aoSideR { to { opacity: 0; transform: translateX(50px); } }
  .msg.aout-slide-down { animation: aoDown var(--out-dur, 0.4s) ease-in forwards; }
  @keyframes aoDown { to { opacity: 0; transform: translateY(30px); } }
  .msg.aout-pop { animation: aoPop var(--out-dur, 0.3s) ease-in forwards; }
  @keyframes aoPop { to { opacity: 0; transform: scale(0.6); } }
  .msg.aout-zoom { animation: aoZoom var(--out-dur, 0.4s) ease-in forwards; }
  @keyframes aoZoom { to { opacity: 0; transform: scale(1.7); } }
  .msg.aout-flip { animation: aoFlip var(--out-dur, 0.45s) ease-in forwards; }
  @keyframes aoFlip { to { opacity: 0; transform: perspective(600px) rotateX(90deg); } }
  .msg.aout-blur { animation: aoBlur var(--out-dur, 0.45s) ease-in forwards; }
  @keyframes aoBlur { to { opacity: 0; filter: blur(10px); } }
  /* Saídas que faltavam para a lista ficar igual à da entrada */
  .msg.aout-slide-up { animation: aoUp var(--out-dur, 0.4s) ease-in forwards; }
  @keyframes aoUp { to { opacity: 0; transform: translateY(-30px); } }
  .msg.aout-slide-left { animation: aoSideL var(--out-dur, 0.4s) ease-in forwards; }
  .msg.aout-slide-right { animation: aoSideR var(--out-dur, 0.4s) ease-in forwards; }
  .msg.aout-bounce { animation: aoBounce var(--out-dur, 0.6s) ease-in forwards; }
  @keyframes aoBounce {
    0% { transform: translateY(0); }
    25% { transform: translateY(-18px); }
    100% { opacity: 0; transform: translateY(120px); }
  }
  .msg.aout-spin { animation: aoSpin var(--out-dur, 0.5s) ease-in forwards; }
  @keyframes aoSpin { to { opacity: 0; transform: rotate(360deg) scale(0.3); } }

  /* ---------- Animação em loop da caixa do chat (sai e volta, repetindo) ---------- */
  .loop-pulse { animation: loopPulse var(--loop-dur, 3s) ease-in-out infinite; }
  @keyframes loopPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  .loop-glow { animation: loopGlow var(--loop-dur, 3s) ease-in-out infinite; }
  @keyframes loopGlow { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.4) drop-shadow(0 0 12px rgba(255,255,255,0.5)); } }
  .loop-breathe { animation: loopBreathe var(--loop-dur, 3s) ease-in-out infinite; }
  @keyframes loopBreathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
  .loop-float { animation: loopFloat var(--loop-dur, 3s) ease-in-out infinite; }
  @keyframes loopFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .loop-sway { animation: loopSway var(--loop-dur, 3s) ease-in-out infinite; }
  @keyframes loopSway { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(8px); } 75% { transform: translateX(-8px); } }
  .loop-wiggle { animation: loopWiggle var(--loop-dur, 3s) ease-in-out infinite; }
  @keyframes loopWiggle { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(1.5deg); } 75% { transform: rotate(-1.5deg); } }
  .loop-bounce { animation: loopBounce var(--loop-dur, 3s) ease-in-out infinite; }
  @keyframes loopBounce {
    0%, 25%, 55%, 80%, 100% { transform: translateY(0); }
    40% { transform: translateY(-14px); }
    68% { transform: translateY(-6px); }
  }
  .loop-spin { animation: loopSpin var(--loop-dur, 3s) linear infinite; }
  @keyframes loopSpin { to { transform: rotate(360deg); } }
  .loop-flip { animation: loopFlip var(--loop-dur, 3s) ease-in-out infinite; }
  @keyframes loopFlip {
    0%, 55% { transform: perspective(700px) rotateY(0deg); }
    100% { transform: perspective(700px) rotateY(360deg); }
  }
  .loop-blur { animation: loopBlur var(--loop-dur, 3s) ease-in-out infinite; }
  @keyframes loopBlur { 0%, 100% { filter: blur(0); } 50% { filter: blur(4px); } }
  .loop-shake { animation: loopShake var(--loop-dur, 3s) ease-in-out infinite; }
  @keyframes loopShake {
    0%, 62%, 100% { transform: translateX(0); }
    66% { transform: translateX(-6px); } 70% { transform: translateX(6px); }
    74% { transform: translateX(-4px); } 78% { transform: translateX(4px); }
    82% { transform: translateX(-2px); } 86% { transform: translateX(2px); }
  }
</style>
<style id="formato-css"></style>
<style id="custom-css"></style>
</head>
<body class="align-left style-bubbles avatar-circle accent-bar">
<div id="box"></div>

<script src="/i18n.js"></script>
<script src="/render.js"></script>
<script>
'use strict';

const box = document.getElementById('box');
const customStyle = document.getElementById('custom-css');
let chat = null; // settings.chat
// As configuracoes inteiras ficam a mao: o render.js consulta settings.selos
// para saber quais distintivos podem aparecer.
let settings = null;

function hexToRgba(hex, alpha) {
  const match = /^#?([0-9a-f]{6})$/i.exec(hex || '');
  if (!match) return hex;
  const n = parseInt(match[1], 16);
  return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${alpha})`;
}

const CHAT_LOOPS = ['pulse', 'glow', 'breathe', 'float', 'sway', 'wiggle', 'bounce', 'spin', 'flip', 'blur', 'shake'];
let chatLoopTimer = null;

function applySettings(next) {
  settings = next;
  // 📺 v0.50: o chat fixo é tela do PÚBLICO (fonte do OBS) — segue o idioma
  // escolhido nas configurações, sem tocar na escolha pessoal do navegador
  if (window.OBS_I18N) OBS_I18N.seguir(settings.idioma);
  chat = settings.chat || {};
  const root = document.documentElement.style;
  // Velocidades das animacoes (0 = padrao rapido; 1 a 15 segundos)
  const clampSecs = (v, min, max) => Math.max(min, Math.min(max, Number(v) || 0));
  if (Number(chat.animationSeconds) > 0) root.setProperty('--in-dur', clampSecs(chat.animationSeconds, 1, 15) + 's');
  else root.removeProperty('--in-dur');
  if (Number(chat.animationOutSeconds) > 0) root.setProperty('--out-dur', clampSecs(chat.animationOutSeconds, 1, 15) + 's');
  else root.removeProperty('--out-dur');
  // Loop da caixa inteira do chat (sai e volta, repetindo)
  clearTimeout(chatLoopTimer);
  box.classList.remove(...CHAT_LOOPS.map((l) => 'loop-' + l));
  const loop = chat.loopAnimation || 'none';
  if (CHAT_LOOPS.includes(loop)) {
    box.style.setProperty('--loop-dur', clampSecs(chat.loopSeconds || 3, 1, 15) + 's');
    box.classList.add('loop-' + loop);
    const total = Math.max(0, Math.min(3600, Number(chat.loopDurationSeconds) || 0));
    if (total > 0) chatLoopTimer = setTimeout(() => box.classList.remove('loop-' + loop), total * 1000);
  }
  root.setProperty('--font-family', chat.fontFamily || "'Segoe UI', sans-serif");
  root.setProperty('--font-size', (chat.fontSize || 18) + 'px');
  root.setProperty('--text-color', chat.textColor || '#fff');
  root.setProperty('--chat-width', (chat.width || 380) + 'px');
  root.setProperty('--spacing', (Number(chat.spacing) || 0) + 'px');
  root.setProperty('--border-radius', (Number(chat.borderRadius) || 0) + 'px');
  root.setProperty('--msg-bg', hexToRgba(chat.bgColor || '#111827', Number.isFinite(Number(chat.bgOpacity)) ? chat.bgOpacity : 0.85));

  document.body.className = [
    'align-' + (chat.align || 'left'),
    'style-' + (chat.msgStyle || 'bubbles'),
    'avatar-' + (chat.avatarShape || 'circle'),
    chat.direction === 'top' ? 'dir-top' : '',
    chat.accentBar ? 'accent-bar' : '',
    chat.textShadow ? 'text-shadow' : '',
    chat.textoAbaixo ? 'texto-abaixo' : '',
  ].filter(Boolean).join(' ');

  // 📺 Posição livre vinda do 🖱️ Organizar a tela: x/y em % da tela
  // (sem eles, vale o lado de sempre) e altura própria em px (0 = inteira)
  if (Number.isFinite(Number(chat.x)) && chat.x !== null && chat.x !== '') {
    box.style.left = Number(chat.x) + '%';
    box.style.right = 'auto';
    box.style.top = (Number(chat.y) || 0) + '%';
  } else {
    box.style.left = '';
    box.style.right = '';
    box.style.top = '';
  }
  if (Number(chat.height) > 0) {
    box.style.height = Number(chat.height) + 'px';
    box.style.bottom = 'auto';
  } else {
    box.style.height = '';
    box.style.bottom = '';
  }

  // ✍️ v0.110: as peças de texto do chat (nome de quem comenta e texto do
  // comentário) têm a mesma formatação dos outros overlays — formatoDaPeca do
  // render.js. A cor entra com !important porque o nome já vem pintado inline.
  {
    const pz = chat.pecas || {};
    const regra = (sel, p) => {
      const d = formatoDaPeca(p);
      if (/^#[0-9a-f]{6}$/i.test(String((p || {}).cor || ''))) d.push(`color: ${p.cor} !important`);
      return d.length ? `${sel} { ${d.join('; ')}; }` : '';
    };
    document.getElementById('formato-css').textContent = [regra('.msg .author', pz.nome), regra('.msg .msg-text', pz.texto)].filter(Boolean).join('\n');
  }
  customStyle.textContent = String(chat.customCSS || '');
  redesenharSelos();
  trim();
}

function nameColorFor(message) {
  if (chat.nameColorMode === 'custom') return chat.nameColor || '#7c3aed';
  if (chat.nameColorMode === 'author' && message.authorColor) return message.authorColor;
  if (chat.nameColorMode === 'author') return platformColor(message.platform);
  return platformColor(message.platform);
}

function allowed(message) {
  const platforms = chat.platforms || {};
  return platforms[message.platform] !== false;
}

function addMessage(message, animate) {
  if (!chat || !allowed(message)) return;
  const item = document.createElement('div');
  item.className = 'msg';
  item.dataset.plataforma = message.platform;
  item.dataset.autor = String(message.authorLogin || message.author || '').toLowerCase();
  item.dataset.autorNome = String(message.author || '').toLowerCase();
  item.dataset.id = String(message.id || '');
  if (message.authorId) item.dataset.autorId = String(message.authorId).toLowerCase();
  // Guarda o comentário junto do elemento: e assim que mudar um liga/desliga
  // dos distintivos, da para redesenhar o que ja esta na tela
  item.__msg = message;
  // ☎️ v0.64: daqui para baixo é o que vai AO AR — autor que pareça telefone
  // entra mascarado (o painel continua vendo o número; a busca/dedup acima
  // também usa o original, guardado no item)
  message = mensagemParaTela(message);
  if (animate && chat.animation && chat.animation !== 'none') item.classList.add('anim-' + chat.animation);
  item.style.setProperty('--msg-accent', platformColor(message.platform));
  if (chat.superchatColors && isSuperchat(message) && corHexOk(message.superchat?.color)) {
    item.classList.add('superchat-colored');
    item.style.setProperty('--sc-color', corHexOk(message.superchat.color));
  }

  if (chat.showAvatar) item.appendChild(avatarElement(message));

  const content = document.createElement('div');
  content.className = 'content';
  if (chat.showPlatformIcon) content.appendChild(platformIcon(message.platform));
  if (message.superchat?.amount) {
    const amount = document.createElement('span');
    amount.className = 'sc-amount';
    amount.textContent = message.superchat.amount
      + (message.superchat.converted ? ` ≈ ${message.superchat.converted}` : '');
    amount.style.background = corHexOk(message.superchat.color) || '#ffb300';
    content.appendChild(amount);
  } else if (chat.showBadges) {
    badgeRow(message, (el) => content.appendChild(el));
  }
  const author = document.createElement('span');
  author.className = 'author';
  author.textContent = message.author;
  author.style.color = nameColorFor(message);
  content.appendChild(author);
  // Os dois-pontos ficam separados para sumirem quando o texto vai embaixo
  const sep = document.createElement('span');
  sep.className = 'author-sep';
  sep.textContent = ': ';
  content.appendChild(sep);
  // O texto do comentário mora no próprio .msg-text: assim o tradutor de
  // idiomas nunca mexe no que o público escreveu, e dá para colocá-lo
  // embaixo do nome só trocando o display
  const corpo = document.createElement('span');
  corpo.className = 'msg-text';
  corpo.appendChild(renderRuns(message.runs));
  // 🎟️ v0.119: figurinha guardada como mídia do inscrito (Super Sticker,
  // Telegram, WhatsApp) aparece no chat fixo como uma figurinha grande
  const mid = message.midia;
  if (mid && mid.tipo === 'imagem' && String(mid.url || '').startsWith('/midia-inscritos/')) {
    const fig = document.createElement('img');
    fig.src = mid.url;
    fig.alt = mid.nome || 'figurinha';
    fig.className = 'emote figurinha';
    fig.loading = 'lazy';
    corpo.appendChild(fig);
  }
  content.appendChild(corpo);
  item.appendChild(content);

  // Encaixa pela ORDEM DE CHEGADA (v0.53): o lote do YouTube não fura a fila
  // da Twitch/Kick, e o histórico recuperado ainda entra no lugar certo do
  // passado, não no fim
  item.dataset.ts = String(message.timestamp || 0);
  item.dataset.seq = String(message.seq || 0);
  item.dataset.ordem = String(posicaoNaLinha(message));
  const ordem = posicaoNaLinha(message);
  const seq = Number(message.seq) || 0;
  // mensagem do elemento chegou antes desta?
  const veioAntes = (el) => {
    const elOrdem = Number(el.dataset.ordem);
    const pos = Number.isFinite(elOrdem) ? elOrdem : (Number(el.dataset.ts) || 0);
    return pos < ordem || (pos === ordem && (Number(el.dataset.seq) || 0) < seq);
  };
  if (chat.direction === 'top') {
    let alvo = null;
    for (const filho of box.children) {
      if (veioAntes(filho)) { alvo = filho; break; }
    }
    if (alvo) box.insertBefore(item, alvo);
    else box.appendChild(item);
  } else {
    let alvo = null;
    for (let i = box.children.length - 1; i >= 0; i--) {
      if (!veioAntes(box.children[i])) alvo = box.children[i];
      else break;
    }
    if (alvo) box.insertBefore(item, alvo);
    else box.appendChild(item);
  }
  trim();

  const fade = Number(chat.fadeAfterSeconds) || 0;
  if (fade > 0) {
    setTimeout(() => {
      removeMsg(item);
      setTimeout(() => item.remove(), 700);
    }, fade * 1000);
  }
}

// Remove uma mensagem com a animacao de saida escolhida
function removeMsg(item) {
  if (!item || item.dataset.leaving) return;
  const anim = chat?.animationOut || 'fade';
  if (anim === 'none') { item.remove(); return; }
  item.dataset.leaving = '1';
  item.classList.add('aout-' + anim);
  const secs = Math.max(0, Math.min(15, Number(chat?.animationOutSeconds) || 0));
  setTimeout(() => item.remove(), (secs > 0 ? secs * 1000 : 520) + 80);
}

function trim() {
  const max = Math.max(1, Number(chat?.maxMessages) || 12);
  const live = () => [...box.children].filter((el) => !el.dataset.leaving);
  let arr = live();
  while (arr.length > max) {
    // Remove sempre a mensagem mais antiga, seja qual for o sentido
    removeMsg(chat?.direction === 'top' ? arr[arr.length - 1] : arr[0]);
    arr = live();
  }
}

// 🏷️ Mudou um liga/desliga dos distintivos: os comentários que já estão na
// tela também obedecem na hora, sem esperar chegar comentário novo.
function redesenharSelos() {
  for (const item of box.children) {
    const message = item.__msg;
    const content = item.querySelector('.content');
    if (!message || !content) continue;
    for (const velho of [...content.querySelectorAll('.badge')]) velho.remove();
    if (!chat?.showBadges || message.superchat?.amount) continue;
    const autor = content.querySelector('.author');
    badgeRow(message, (el) => content.insertBefore(el, autor));
  }
}

// 🗑️ Comentário apagado pela moderação (ou alguém banido, ou chat limpo):
// sai da tela do chat fixo do mesmo jeito que sai no site da plataforma.
function apagarMensagens(aviso) {
  const rede = aviso.platform || null;
  const ids = new Set((aviso.ids || []).map(String));
  const quem = aviso.autor ? String(aviso.autor).toLowerCase() : null;
  for (const item of [...box.children]) {
    if (rede && item.dataset.plataforma !== rede) continue;
    const combina = aviso.tudo
      || ids.has(String(item.dataset.id))
      || (quem && (item.dataset.autor === quem || item.dataset.autorNome === quem || item.dataset.autorId === quem));
    if (combina) item.remove();
  }
}

connectHub((event) => {
  switch (event.type) {
    case 'init':
      // 🔄 v0.75.1: programa atualizado com esta tela aberta → recarrega
      // para rodar o código novo (fonte do OBS/aba não recarrega sozinha)
      if (!window.versaoDoPrograma) window.versaoDoPrograma = event.version || 'x';
      else if (event.version && window.versaoDoPrograma !== event.version) { location.reload(); break; }
      applySettings(event.settings);
      box.innerHTML = '';
      for (const message of (event.recent || []).slice(-30)) addMessage(message, false);
      break;
    case 'settings':
      applySettings(event.settings);
      break;
    case 'chat':
      addMessage(event.message, true);
      break;
    case 'apagadas':
      apagarMensagens(event);
      break;
    case 'avatarFix': {
      // Foto descoberta depois: troca as iniciais pela foto nas mensagens já na tela
      const alvo = String(event.login || '').toLowerCase();
      if (!avatarUrlOk(event.avatar) || !alvo) break; // 🔒 v0.127.1: só https ou foto local
      // 🖼️ v0.138: a mesma troca do painel e da tela do público (render.js)
      aplicarFotoQueChegou(document.body, event.platform, alvo, event.avatar);
      break;
    }
  }
});
</script>
