<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>OBS Social — Overlay</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; overflow: hidden; width: 100%; height: 100%; }
  body {
    font-family: var(--font-family, 'Segoe UI', system-ui, sans-serif);
    color: var(--text-color, #fff);
  }

  /* Moldura em tela inteira (overlay proprio do usuario) */
  #fullscreenMedia {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 0; display: none;
  }
  #fullscreenMedia img, #fullscreenMedia video {
    width: 100%; height: 100%; object-fit: fill;
  }

  #stage {
    position: fixed;
    inset: 40px;
    display: flex;
    flex-direction: column;
    pointer-events: none;
    z-index: 1;
  }
  #stage.pos-custom         { display: block; }
  #stage.pos-bottom-left    { justify-content: flex-end; align-items: flex-start; }
  #stage.pos-bottom-center  { justify-content: flex-end; align-items: center; }
  #stage.pos-bottom-right   { justify-content: flex-end; align-items: flex-end; }
  #stage.pos-top-left       { justify-content: flex-start; align-items: flex-start; }
  #stage.pos-top-center     { justify-content: flex-start; align-items: center; }
  #stage.pos-top-right      { justify-content: flex-start; align-items: flex-end; }

  .featured {
    position: relative;
    overflow: hidden;
    zoom: var(--f-scale, 1); /* tamanho geral, ajustado no editor de tela */
    display: flex;
    align-items: center;
    gap: 0.6em;
    background: var(--card-bg, var(--bg-color, rgba(17, 24, 39, 0.92)));
    border-left: var(--accent-bar, 0.28em) solid var(--card-accent, var(--accent-color, #7c3aed));
    border-radius: var(--border-radius, 16px);
    padding: calc(0.55em * var(--pad-scale, 1)) calc(0.9em * var(--pad-scale, 1));
    max-width: var(--max-width, 640px);
    font-size: var(--font-size, 26px);
  }
  body.card-shadow .featured { box-shadow: var(--ov-sombra, 0 1.5vmin 6vmin rgba(0,0,0,0.55)); }
  body.text-shadow .featured { text-shadow: 0 2px 6px rgba(0,0,0,0.8); }

  .featured .media-layer {
    position: absolute; inset: 0; z-index: 0;
    width: 100%; height: 100%; object-fit: var(--media-fit, cover);
    opacity: var(--media-opacity, 1);
  }
  /* 🖼️ v0.102: no tamanho real, a arte só aparece quando a medida do arquivo
     chegou (um vídeo mede 300×150 antes da ficha técnica — seria um piscar) */
  .featured .media-layer.carregando { visibility: hidden; }
  /* 🖼️ "A arte É o cartão": some o fundo padrão, a barrinha e a sombra —
     fica só a mídia do usuário, com as peças/conteúdo por cima */
  .featured.featured--soArte {
    background: transparent !important;
    border-left-width: 0 !important;
  }
  /* 🖼️ v0.93/v0.94: alguma peça saiu do tamanho do cartão padrão (o streamer
     esticou ou moveu ela — a arte, o avatar, o nome...) e o cartão para de
     recortar, senão ela simplesmente sumia. Só entra quando algo realmente
     escapa: cartão com tudo dentro continua recortado pelo cantinho
     arredondado, como sempre foi. */
  .featured.featured--arteSolta { overflow: visible; }
  body.card-shadow .featured.featured--soArte { box-shadow: none; }
  .featured > .avatar, .featured > .body { position: relative; z-index: 1; }

  .featured .avatar {
    width: 1.9em; height: 1.9em; flex-shrink: 0; object-fit: cover;
  }
  body.avatar-circle .avatar { border-radius: 50%; }
  body.avatar-rounded .avatar { border-radius: 0.35em; }
  body.avatar-square .avatar { border-radius: 0; }
  .avatar.initials {
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 0.9em;
  }
  .featured .body { min-width: 0; }
  .featured .meta {
    display: flex; align-items: center; gap: 0.35em;
    font-size: 0.62em; opacity: 0.95; margin-bottom: 0.15em; flex-wrap: wrap;
  }
  /* ✍️ v0.100: --card-nome é a cor escolhida para o NOME; sem escolha, ele
     segue a cor de destaque do cartão, como sempre foi */
  .featured .author { font-weight: 700; color: var(--card-nome, var(--card-accent, var(--accent-color, #7c3aed))); }
  .featured .platform-name { opacity: 0.7; }
  .featured .msg-time { opacity: 0.65; font-size: 0.82em; align-self: center; }
  .featured .badge {
    font-size: 0.75em; background: rgba(255,255,255,0.18); border-radius: 0.4em;
    padding: 0.05em 0.4em;
  }
  .featured .sc-amount {
    font-weight: 800; border-radius: 0.4em; padding: 0.05em 0.45em; color: #000;
  }
  /* 💰 v0.109: valor como TEXTO simples — sem a pílula, na cor da peça (como
     o nome e o texto); cabe no espaço que a arte reserva para ele */
  .featured .sc-amount.sc-amount--texto {
    background: none !important; padding: 0; border-radius: 0; color: inherit; font-weight: inherit;
  }
  /* 💰 No overlay em peças o valor fica numa linha SÓ: a etiqueta convertida
     («$5.00 ≈ R$ 27,00») quebrada em duas linhas atropelava a mensagem */
  .featured--livre .peca-valor { white-space: nowrap; overflow: hidden; }
  .featured--livre .peca-valor.ajuste-cortar { text-overflow: ellipsis; }
  .featured--livre .peca-valor.ajuste-vazar { overflow: visible; }
  /* 🏷️ Distintivos com a arte original da plataforma */
  .featured .badge-img {
    background: rgba(255,255,255,0.14); padding: 0.1em 0.22em; line-height: 0;
    display: inline-block;
  }
  .featured .badge-img img { height: 1.1em; width: auto; display: block; }
  .featured .badge-com-arte {
    display: inline-flex; align-items: center; gap: 0.24em;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.3), 0 1px 3px rgba(0,0,0,0.35);
  }
  .featured .badge-com-arte img { height: 1.1em; width: auto; }
  .featured .badge-extra {
    font-weight: 700;
    background: color-mix(in srgb, var(--selo-cor, #fff) 26%, rgba(255,255,255,0.14));
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--selo-cor, #fff) 60%, transparent);
  }
  .featured .badge-role {
    box-shadow: 0 0 0 1px rgba(0,0,0,0.3), 0 1px 3px rgba(0,0,0,0.35);
    text-shadow: 0 1px 1px rgba(0,0,0,0.4);
  }
  /* ✍️ v0.145: as quebras de linha da pessoa aparecem também na tela do público */
  .featured .msg-text { line-height: 1.3; word-wrap: break-word; overflow-wrap: anywhere; white-space: pre-wrap; }
  .featured .msg-text code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.92em; }
  /* 🎙️ v0.140: a fala do áudio/vídeo ocupa a região do comentário. Sozinha,
     ela É o comentário (mesmo tamanho); junto de um texto escrito, entra
     como um complemento discreto logo abaixo. */
  .featured .ov-transcricao { line-height: 1.3; word-wrap: break-word; overflow-wrap: anywhere; }
  .featured .ov-transcricao--extra { font-size: 0.86em; opacity: 0.85; margin-top: 0.15em; }
  .featured .ov-transcricao--marca { opacity: 0.72; font-style: italic; }

  /* 🧩 Modo peças soltas: cada parte do destaque numa posição própria, em %
     do cartão. O cartão vira uma caixa de tamanho fixo (largura máxima ×
     altura escolhida) e recorta o que tentar sair dele. */
  .featured--livre {
    display: block;
    width: var(--max-width, 640px);
    height: calc(var(--card-h, 4.6) * 1em);
  }
  .featured--livre .peca { position: absolute; margin: 0; line-height: 1.2; z-index: 1; }
  /* Avatar de iniciais: o font-size 0.9em encolheria a caixa (largura em em
     do PRÓPRIO elemento) — compensa para o tamanho ficar igual ao da foto.
     E o display: flex volta por cima do display: block da regra geral do
     avatar livre (mais específica que .avatar.initials): sem ele a letra
     perdia a centralização e ficava torta no cantinho do círculo */
  .featured--livre .peca-avatar .avatar.initials {
    width: calc(1.9em / 0.9); height: calc(1.9em / 0.9);
    display: flex; line-height: 1;
  }
  .featured--livre .peca-avatar .avatar {
    display: block; box-sizing: border-box;
    border: calc(var(--pb, 0) * 1px) solid var(--pbc, #ffffff);
  }
  /* 📐 v0.98: com largura/altura escolhidas, o conteúdo preenche a caixa —
     é o que faz o avatar e o ícone da rede obedecerem aos dois seletores */
  .featured--livre .peca--caixa > .peca-conteudo { width: 100%; height: 100%; }
  /* 🎯 v0.104: toda peça com caixa escolhida (fora o nome e o texto, que têm
     a régua própria deles) CENTRALIZA o conteúdo na caixa — distintivos,
     valor, avatar e ícone ficavam encostados na esquerda/no alto. O avatar e
     o ícone viram um quadrado do tamanho do lado escolhido (dos dois lados,
     o menor), centrado — sem esticar em elipse (o tamanho vem do JS). */
  .featured--livre .peca--caixa:not(.peca-texto) {
    display: flex; align-items: center; justify-content: center; text-align: center;
  }
  .featured--livre .peca--caixa:not(.peca-texto) > .peca-conteudo {
    width: auto; height: auto; max-width: 100%; max-height: 100%;
  }
  /* 🎯 v0.107: o NOME também centraliza na caixa. O encaixe dele (encolher,
     cortar, vazar) passa a valer no conteúdo: é ali que o texto corre. */
  .featured--livre .peca-nome > .peca-conteudo { white-space: nowrap; overflow: hidden; }
  .featured--livre .peca-nome.ajuste-cortar > .peca-conteudo { text-overflow: ellipsis; }
  .featured--livre .peca-nome.ajuste-vazar > .peca-conteudo { overflow: visible; max-width: none; }
  .featured--livre .peca-avatar.peca--caixa .avatar,
  .featured--livre .peca-avatar.peca--caixa .avatar.initials { width: var(--quadrado, 100%); height: var(--quadrado, 100%); }
  .featured--livre .peca-icone.peca--caixa .platform-icon { width: var(--quadrado, 100%); height: var(--quadrado, 100%); }
  .featured--livre .peca-nome {
    white-space: nowrap; overflow: hidden; font-weight: 700;
    color: var(--card-nome, var(--card-accent, var(--accent-color, #7c3aed)));
  }
  .featured--livre .peca-nome.ajuste-cortar { text-overflow: ellipsis; }
  .featured--livre .peca-nome.ajuste-vazar { overflow: visible; }
  .featured--livre .peca-texto {
    overflow: hidden; line-height: 1.25;
    word-wrap: break-word; overflow-wrap: anywhere;
  }
  .featured--livre .peca-texto.ajuste-vazar { overflow: visible; }
  .featured--livre .peca-selos {
    display: flex; align-items: center; gap: 0.3em;
    flex-wrap: nowrap; overflow: hidden; max-width: 100%;
  }
  /* 🎯 v0.111: os distintivos e a etiqueta do valor ficam CENTRADOS por caixa
     flex também dentro do conteúdo da peça — como texto em linha eles eram
     alinhados pela linha de base da letra, e a etiqueta saía ~1 px abaixo/
     acima do meio da caixa (e o ⌖ centrava a caixa, não o que se vê) */
  .featured--livre .peca-selos > .peca-conteudo,
  .featured--livre .peca-valor > .peca-conteudo {
    display: flex; align-items: center; justify-content: center;
  }
  .featured--livre .peca-selos > .peca-conteudo { gap: 0.3em; flex-wrap: nowrap; }
  /* O conteúdo interno é quem encolhe no ajuste "encolher" */
  .peca .peca-conteudo { font-size: calc(var(--fit, 1) * 1em); }
  .emote { height: 1.3em; vertical-align: middle; }
  /* 🎟️ v0.118: Super Sticker do YouTube — figurinha grande no lugar do texto */
  .emote.figurinha { height: 3.4em; max-height: 120px; width: auto; display: inline-block; vertical-align: middle; }
  .platform-icon { width: 1em; height: 1em; flex-shrink: 0; }

  /* ---------- Widgets (QR, likometro, sorteio, winstreak) ---------- */
  .widget {
    position: fixed; z-index: 3;
    background: var(--w-bg, rgba(17,24,39,0.92));
    color: var(--w-text, #fff);
    border-radius: var(--w-radius, 16px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.45);
    display: none; overflow: hidden;
  }
  .widget { transform: var(--pos-tf, none); }
  /* 🧩 v0.94: o widget recortava as peças dele igual o cartão do destaque —
     mover ou esticar uma peça para fora fazia ela sumir. Quando alguma
     escapa, este widget para de recortar (os outros seguem intactos). */
  .widget.widget--solto { overflow: visible; }
  .widget.visible { display: flex; }
  .widget .w-media {
    position: absolute; inset: 0; z-index: 0;
    width: 100%; height: 100%; object-fit: cover;
  }
  .widget > :not(.w-media) { position: relative; z-index: 1; }

  .wpos-top-left      { top: 40px; left: 40px; }
  .wpos-top-center    { top: 40px; left: 50%; --pos-tf: translateX(-50%); }
  .wpos-top-right     { top: 40px; right: 40px; }
  .wpos-middle-left   { top: 50%; left: 40px; --pos-tf: translateY(-50%); }
  .wpos-center        { top: 50%; left: 50%; --pos-tf: translate(-50%, -50%); }
  .wpos-middle-right  { top: 50%; right: 40px; --pos-tf: translateY(-50%); }
  .wpos-bottom-left   { bottom: 40px; left: 40px; }
  .wpos-bottom-center { bottom: 40px; left: 50%; --pos-tf: translateX(-50%); }
  .wpos-bottom-right  { bottom: 40px; right: 40px; }

  /* QR Code (o principal e os adicionais) */
  .widget[data-widget="qr"] { flex-direction: column; align-items: center; gap: 8px; padding: 12px; }
  .widget[data-widget="qr"] canvas { display: block; border-radius: 6px; }
  .widget[data-widget="qr"] .qr-name {
    color: var(--w-text, #111); font-weight: 700; font-size: 18px; max-width: 200px;
    text-align: center; word-wrap: break-word;
  }

  /* Likometro */
  #likemeter { flex-direction: column; gap: 6px; min-width: 320px; padding: 10px 22px; font-size: 22px; }
  #likemeter .lm-row { display: flex; justify-content: space-between; gap: 24px; font-weight: 700; }
  #likemeter .lm-viewers { color: var(--w-viewers, #ff5c5c); }
  #likemeter .lm-likes { color: var(--w-likes, #4da3ff); }
  /* v0.52.1: a % no meio e em destaque (é o número que conta a história) */
  #likemeter .lm-row { align-items: center; }
  #likemeter .lm-pct {
    font-weight: 900; font-size: 1.35em; line-height: 1;
    letter-spacing: -0.5px; text-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
  }
  #likemeter .lm-bar { height: 10px; border-radius: 6px; background: rgba(255,255,255,0.15); overflow: hidden; }
  #likemeter .lm-fill {
    height: 100%; width: 0%; border-radius: 6px;
    background: linear-gradient(90deg, var(--w-likes, #4da3ff), var(--w-accent, #7c3aed));
    transition: width 0.8s ease;
  }
  #likemeter .lm-label { font-size: 13px; opacity: 0.75; text-align: center; }

  /* Winstreak (o principal e os adicionais) */
  /* ATENÇÃO: nada de "position: relative" aqui — .widget já é "fixed", que é
     o que coloca o cartão no canto escolhido. Trocar por relative jogava o
     widget de volta no fluxo da página e ele virava uma faixa da largura
     inteira da tela (foi o que aconteceu na v0.26.0). O "fixed" também já
     serve de âncora para as faíscas, que são absolutas. */
  .widget[data-widget="winstreak"] {
    align-items: center; gap: 10px; padding: 10px 20px;
    font-size: 26px; font-weight: 800;
  }
  .widget[data-widget="winstreak"] .ws-label { color: var(--w-text, #fff); }
  .widget[data-widget="winstreak"] .ws-nums { color: var(--w-accent, #ffd700); }

  /* 🏆 Marcos do winstreak na TELA: o efeito acompanha o número e só sai
     quando ele deixa o marco. 1 = dezenas, 2 = grandes, 3 = dobras. */
  .widget[data-widget="winstreak"] .ws-nums.marco-1 {
    color: #ffd700; text-shadow: 0 0 10px rgba(255,215,0,0.8);
    animation: ovMarco1 2s ease-in-out infinite;
  }
  @keyframes ovMarco1 { 50% { text-shadow: 0 0 18px rgba(255,215,0,1); } }

  .widget[data-widget="winstreak"] .ws-nums.marco-2 {
    color: #ffcc33; text-shadow: 0 0 12px #ffae00, 0 0 24px rgba(255,110,0,0.75);
    animation: ovMarco2 1.4s ease-in-out infinite;
  }
  @keyframes ovMarco2 { 50% { transform: scale(1.1); text-shadow: 0 0 22px #ffae00, 0 0 40px rgba(255,80,0,0.9); } }

  .widget[data-widget="winstreak"] .ws-nums.marco-3 {
    color: #fff;
    text-shadow: 0 0 12px #ff2d95, 0 0 24px #7c3aed, 0 0 36px #22d3ee;
    animation: ovMarco3 1.1s ease-in-out infinite;
  }
  @keyframes ovMarco3 {
    0%, 100% { transform: scale(1); text-shadow: 0 0 12px #ff2d95, 0 0 24px #7c3aed, 0 0 36px #22d3ee; }
    50% { transform: scale(1.18); text-shadow: 0 0 20px #ffd700, 0 0 36px #ff2d95, 0 0 56px #22d3ee; }
  }
  /* Faíscas: pontinhos que sobem DENTRO do cartão (níveis 2 e 3).
     O cartão tem overflow:hidden por causa da mídia de fundo, então as
     faíscas sobem só a altura dele — nada escapa para fora. */
  .widget[data-widget="winstreak"] .ws-faiscas {
    position: absolute; inset: 0; pointer-events: none; z-index: 2;
  }
  .widget[data-widget="winstreak"] .ws-faiscas i {
    position: absolute; bottom: 0.1em; width: 0.2em; height: 0.2em; border-radius: 50%;
    background: #ffd700; box-shadow: 0 0 0.3em #ffd700;
    opacity: 0; animation: ovFaisca 1.8s ease-out infinite;
  }
  /* A subida é em "em" para acompanhar o tamanho da letra do cartão */
  @keyframes ovFaisca {
    0% { opacity: 0; transform: translateY(0) scale(0.5); }
    20% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-1.5em) scale(1.1); }
  }
  /* Nas dobras as faíscas ficam coloridas e mais numerosas */
  .widget[data-widget="winstreak"].marco-nivel-3 .ws-faiscas i:nth-child(3n) { background: #ff2d95; box-shadow: 0 0 10px #ff2d95; }
  .widget[data-widget="winstreak"].marco-nivel-3 .ws-faiscas i:nth-child(3n+1) { background: #22d3ee; box-shadow: 0 0 10px #22d3ee; }
  .widget[data-widget="winstreak"].marco-nivel-3 .ws-faiscas i:nth-child(3n+2) { background: #ffd700; box-shadow: 0 0 10px #ffd700; }
  /* O cartão inteiro ganha um halo nas dobras */
  .widget[data-widget="winstreak"].marco-nivel-3 {
    box-shadow: 0 0 22px rgba(255,45,149,0.55), 0 0 44px rgba(124,58,237,0.4), 0 8px 32px rgba(0,0,0,0.45);
    animation: ovHalo 1.1s ease-in-out infinite;
  }
  @keyframes ovHalo { 50% { box-shadow: 0 0 30px rgba(255,215,0,0.7), 0 0 60px rgba(34,211,238,0.5), 0 8px 32px rgba(0,0,0,0.45); } }
  .widget[data-widget="winstreak"].marco-nivel-2 {
    box-shadow: 0 0 18px rgba(255,174,0,0.5), 0 8px 32px rgba(0,0,0,0.45);
  }

  /* Audiencia ao vivo */
  #audienceWidget { flex-direction: column; gap: 8px; padding: 12px 20px; font-size: 24px; font-weight: 800; }
  #audienceWidget .aud-total { display: flex; align-items: center; gap: 10px; justify-content: center; }
  #audienceWidget .aud-total .aud-count { color: var(--w-accent, #ff5c5c); font-size: 1.25em; }
  #audienceWidget .aud-icons { display: flex; gap: 8px; align-items: center; justify-content: center; }
  #audienceWidget .aud-icons .platform-icon { width: 0.85em; height: 0.85em; }
  #audienceWidget .aud-rows { display: flex; flex-direction: column; gap: 6px; }
  #audienceWidget .aud-row { display: flex; align-items: center; gap: 12px; justify-content: space-between; }
  #audienceWidget .aud-row .platform-icon { width: 1.05em; height: 1.05em; }
  #audienceWidget .aud-row .aud-count { color: var(--w-accent, #ff5c5c); }

  /* 📢 Avisos */
  .widget[data-widget="aviso"] {
    flex-direction: column; align-items: center; justify-content: center;
    padding: calc(14px * var(--w-pad, 1)) calc(22px * var(--w-pad, 1));
    max-width: var(--av-max, 900px);
  }
  .widget[data-widget="aviso"] .av-texto {
    color: var(--w-text, #fff);
    font-family: var(--av-font, inherit);
    font-size: var(--av-size, 30px);
    line-height: var(--av-lh, 1.3);
    text-align: var(--av-align, center);
    white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere;
    max-width: 100%;
  }
  .widget[data-widget="aviso"].av-negrito .av-texto { font-weight: 800; }
  .widget[data-widget="aviso"].av-italico .av-texto { font-style: italic; }
  .widget[data-widget="aviso"].av-sublinhado .av-texto { text-decoration: underline; }
  .widget[data-widget="aviso"].av-maiusculas .av-texto { text-transform: uppercase; }
  .widget[data-widget="aviso"].av-sombra .av-texto { text-shadow: 0 2px 8px rgba(0,0,0,0.85); }
  /* Contagem final do timer: o aviso pisca suavemente (nunca some de vez).
     A animação vai no texto, e não no quadro inteiro, porque o quadro já usa
     a sua própria animação de entrada/saída/laço escolhida nas configurações. */
  .widget[data-widget="aviso"].av-contagem .av-texto { animation: avContagem 1s ease-in-out infinite; }
  /* Cor da piscada do Aviso: vazia = mantém a cor normal do texto */
  .widget[data-widget="aviso"].av-contagem.av-cor .av-texto { color: var(--av-cor-pisca, #ffd23f); }
  @keyframes avContagem { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

  /* 🕐 Relógio / cronômetro / timer */
  .widget[data-widget="relogio"] {
    flex-direction: column; align-items: center; gap: 2px;
    padding: calc(10px * var(--w-pad, 1)) calc(20px * var(--w-pad, 1));
  }
  .widget[data-widget="relogio"] .rl-hora {
    color: var(--w-text, #fff);
    font-family: var(--rl-font, inherit);
    font-size: var(--rl-size, 44px);
    font-variant-numeric: tabular-nums; letter-spacing: 1px; line-height: 1.1;
  }
  .widget[data-widget="relogio"].rl-negrito .rl-hora { font-weight: 800; }
  .widget[data-widget="relogio"] .rl-data,
  .widget[data-widget="relogio"] .rl-rotulo {
    color: var(--w-accent, #7c3aed); font-size: calc(var(--rl-size, 44px) * 0.32);
    font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
  }
  /* Reta final (10 segundos): amarelo pulsando devagar — v0.80: os três
     instrumentos podem dividir o widget, então a piscada mira SÓ o timer */
  .widget[data-widget="relogio"].rl-final10 .rl-hora.rl-timer { color: var(--rl-cor-final, #ffd23f); animation: rlFinal 1s ease-in-out infinite; }
  /* Fim do timer: vermelho piscando de forma suave, sem susto */
  .widget[data-widget="relogio"].rl-fim .rl-hora.rl-timer { color: var(--rl-cor-fim, #ff5c5c); animation: rlPisca 1.8s ease-in-out infinite; }
  @keyframes rlPisca { 0%, 100% { opacity: 1; } 50% { opacity: 0.32; } }
  @keyframes rlFinal { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }

  /* 🔇 Convite para liberar o som quando o overlay é aberto num navegador
     comum (celular, tablet, outro PC). Dentro do OBS ele nunca aparece. */
  #somBloqueadoOv {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    z-index: 9000; display: none; cursor: pointer;
    padding: 10px 16px; border-radius: 12px; font-size: 15px; font-weight: 700;
    color: #fff; background: rgba(20,20,26,0.88); border: 1px solid #ffd23f;
  }
  #somBloqueadoOv.mostrar { display: block; }

  /* Sorteio (podio) */
  #raffleWidget { flex-direction: column; align-items: center; gap: 20px; padding: 30px 40px; }
  .raffle-title { font-size: 32px; font-weight: 800; letter-spacing: 1px; }
  .raffle-spinner { font-size: 52px; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .podium { display: flex; align-items: flex-end; gap: 22px; }
  .podium.vertical { flex-direction: column; align-items: stretch; gap: 12px; }
  .winner {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    animation: winnerIn 0.5s cubic-bezier(0.2, 1.2, 0.4, 1) both;
  }
  .podium.vertical .winner { flex-direction: row; gap: 14px; justify-content: flex-start; }
  /* Só o "from": o fim da animação é o estilo natural do card — assim o
     esmaecido do .perdeu vale mesmo com a animação preenchida (both) */
  @keyframes winnerIn { from { opacity: 0; transform: translateY(30px); } }
  /* Atualização de um pódio que JÁ foi revelado: aparece pronto, sem re-animar */
  .winner.sem-anim { animation: none; }
  /* 💬⏱ v0.50: resposta do ganhador, "não respondeu" e o timer da vez */
  .winner.perdeu { opacity: 0.35; filter: grayscale(0.8); }
  .winner .w-perdeu { font-size: 12px; font-weight: 700; color: #ff5c5c; }
  .winner .w-reply {
    font-size: 13px; background: rgba(255, 255, 255, 0.12); border-radius: 10px;
    padding: 4px 10px; max-width: 220px; word-break: break-word;
  }
  .winner .w-timer { font-weight: 800; font-variant-numeric: tabular-nums; color: var(--rl-cor-final, #ffd23f); }
  .winner .w-timer.final10 { color: #ff5c5c; animation: rfTimerPisca 1s ease-in-out infinite; }
  @keyframes rfTimerPisca { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  @media (prefers-reduced-motion: reduce) {
    .winner { animation: none; }
    .winner .w-timer.final10 { animation: none; }
  }
  .winner .medal { font-size: 42px; }
  .podium.vertical .winner .medal { font-size: 34px; }
  .winner .w-avatar {
    width: 84px; height: 84px; border-radius: 50%; object-fit: cover;
    border: 4px solid var(--m-color, gold);
    display: flex; align-items: center; justify-content: center;
    font-size: 36px; font-weight: 800; color: #fff;
  }
  .winner.first .w-avatar { width: 110px; height: 110px; }
  .podium.vertical .winner .w-avatar { width: 56px; height: 56px; font-size: 24px; }
  .podium.vertical .winner.first .w-avatar { width: 72px; height: 72px; }
  .winner .w-name {
    font-size: 22px; font-weight: 800; max-width: 220px; text-align: center;
    word-wrap: break-word; color: var(--m-color, gold);
  }
  .winner.first .w-name { font-size: 27px; }
  .podium.vertical .winner .w-name { text-align: left; max-width: 320px; }
  .winner .w-platform { display: flex; align-items: center; gap: 5px; font-size: 14px; opacity: 0.8; }

  /* ---------- Animações de entrada (comentário em destaque) ---------- */
  .anim-slide-up { animation: slideUp var(--in-dur, 0.35s) cubic-bezier(0.2, 0.9, 0.3, 1.2); }
  @keyframes slideUp { from { opacity: 0; transform: translateY(50px); } }
  .anim-slide-down { animation: slideDown var(--in-dur, 0.35s) cubic-bezier(0.2, 0.9, 0.3, 1.2); }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-50px); } }
  .anim-slide-left { animation: slideLeft var(--in-dur, 0.4s) cubic-bezier(0.2, 0.9, 0.3, 1.1); }
  @keyframes slideLeft { from { opacity: 0; transform: translateX(-80px); } }
  .anim-slide-right { animation: slideRight var(--in-dur, 0.4s) cubic-bezier(0.2, 0.9, 0.3, 1.1); }
  @keyframes slideRight { from { opacity: 0; transform: translateX(80px); } }
  .anim-fade { animation: fadeIn var(--in-dur, 0.45s) ease-out; }
  @keyframes fadeIn { from { opacity: 0; } }
  .anim-pop { animation: popIn var(--in-dur, 0.3s) cubic-bezier(0.2, 1.4, 0.4, 1); }
  @keyframes popIn { from { opacity: 0; transform: scale(0.6); } }
  .anim-zoom { animation: zoomIn var(--in-dur, 0.4s) cubic-bezier(0.2, 0.9, 0.3, 1); }
  @keyframes zoomIn { from { opacity: 0; transform: scale(2.2); } }
  .anim-bounce { animation: bounceIn var(--in-dur, 0.7s) ease-out; }
  @keyframes bounceIn {
    0% { opacity: 0; transform: translateY(-220px); }
    45% { opacity: 1; transform: translateY(0); }
    62% { transform: translateY(-32px); }
    78% { transform: translateY(0); }
    89% { transform: translateY(-10px); }
    100% { transform: translateY(0); }
  }
  .anim-flip { animation: flipIn var(--in-dur, 0.5s) cubic-bezier(0.2, 0.9, 0.3, 1.1); }
  @keyframes flipIn { from { opacity: 0; transform: perspective(700px) rotateY(90deg); } }
  .anim-spin { animation: spinIn var(--in-dur, 0.5s) cubic-bezier(0.2, 0.9, 0.3, 1.1); }
  @keyframes spinIn { from { opacity: 0; transform: rotate(-360deg) scale(0.3); } }
  .anim-blur { animation: blurIn var(--in-dur, 0.55s) ease-out; }
  @keyframes blurIn { from { opacity: 0; filter: blur(16px); } }
  .leaving { animation: leave 0.25s ease-in forwards; }
  @keyframes leave { to { opacity: 0; transform: translateY(20px); } }

  /* ---------- Animações de saída (comentário em destaque) ---------- */
  .fout-fade { animation: foFade var(--out-dur, 0.4s) ease-in forwards; }
  @keyframes foFade { to { opacity: 0; } }
  .fout-slide-up { animation: foSlideUp var(--out-dur, 0.35s) ease-in forwards; }
  @keyframes foSlideUp { to { opacity: 0; transform: translateY(-70px); } }
  .fout-slide-down { animation: foSlideDown var(--out-dur, 0.35s) ease-in forwards; }
  @keyframes foSlideDown { to { opacity: 0; transform: translateY(70px); } }
  .fout-slide-left { animation: foSlideLeft var(--out-dur, 0.4s) ease-in forwards; }
  @keyframes foSlideLeft { to { opacity: 0; transform: translateX(-90px); } }
  .fout-slide-right { animation: foSlideRight var(--out-dur, 0.4s) ease-in forwards; }
  @keyframes foSlideRight { to { opacity: 0; transform: translateX(90px); } }
  .fout-pop { animation: foPop var(--out-dur, 0.3s) ease-in forwards; }
  @keyframes foPop { to { opacity: 0; transform: scale(0.5); } }
  .fout-zoom { animation: foZoom var(--out-dur, 0.4s) ease-in forwards; }
  @keyframes foZoom { to { opacity: 0; transform: scale(2.2); } }
  .fout-flip { animation: foFlip var(--out-dur, 0.45s) ease-in forwards; }
  @keyframes foFlip { to { opacity: 0; transform: perspective(700px) rotateY(90deg); } }
  .fout-spin { animation: foSpin var(--out-dur, 0.5s) ease-in forwards; }
  @keyframes foSpin { to { opacity: 0; transform: rotate(360deg) scale(0.3); } }
  .fout-bounce { animation: foBounce var(--out-dur, 0.6s) ease-in forwards; }
  @keyframes foBounce {
    0% { transform: translateY(0); }
    25% { transform: translateY(-30px); }
    100% { opacity: 0; transform: translateY(240px); }
  }
  .fout-blur { animation: foBlur var(--out-dur, 0.5s) ease-in forwards; }
  @keyframes foBlur { to { opacity: 0; filter: blur(16px); } }

  /* ---------- Animações de saída dos widgets (compostas com --pos-tf) ---------- */
  .widget.visible.wout-fade { animation: foFade var(--out-dur, 0.4s) ease-in forwards; }
  .widget.visible.wout-slide-up { animation: woSlideUp var(--out-dur, 0.35s) ease-in forwards; }
  @keyframes woSlideUp { to { opacity: 0; transform: var(--pos-tf, none) translateY(-70px); } }
  .widget.visible.wout-slide-down { animation: woSlideDown var(--out-dur, 0.35s) ease-in forwards; }
  @keyframes woSlideDown { to { opacity: 0; transform: var(--pos-tf, none) translateY(70px); } }
  .widget.visible.wout-slide-left { animation: woSlideLeft var(--out-dur, 0.4s) ease-in forwards; }
  @keyframes woSlideLeft { to { opacity: 0; transform: var(--pos-tf, none) translateX(-90px); } }
  .widget.visible.wout-slide-right { animation: woSlideRight var(--out-dur, 0.4s) ease-in forwards; }
  @keyframes woSlideRight { to { opacity: 0; transform: var(--pos-tf, none) translateX(90px); } }
  .widget.visible.wout-pop { animation: woPop var(--out-dur, 0.3s) ease-in forwards; }
  @keyframes woPop { to { opacity: 0; transform: var(--pos-tf, none) scale(0.5); } }
  .widget.visible.wout-zoom { animation: woZoom var(--out-dur, 0.4s) ease-in forwards; }
  @keyframes woZoom { to { opacity: 0; transform: var(--pos-tf, none) scale(2.2); } }
  .widget.visible.wout-flip { animation: woFlip var(--out-dur, 0.45s) ease-in forwards; }
  @keyframes woFlip { to { opacity: 0; transform: var(--pos-tf, none) perspective(700px) rotateY(90deg); } }
  .widget.visible.wout-spin { animation: woSpin var(--out-dur, 0.5s) ease-in forwards; }
  @keyframes woSpin { to { opacity: 0; transform: var(--pos-tf, none) rotate(360deg) scale(0.3); } }
  .widget.visible.wout-bounce { animation: woBounce var(--out-dur, 0.6s) ease-in forwards; }
  @keyframes woBounce {
    0% { transform: var(--pos-tf, none) translateY(0); }
    25% { transform: var(--pos-tf, none) translateY(-30px); }
    100% { opacity: 0; transform: var(--pos-tf, none) translateY(240px); }
  }
  .widget.visible.wout-blur { animation: foBlur var(--out-dur, 0.5s) ease-in forwards; }

  /* ---------- Animações de entrada dos widgets ----------
     Compostas com a transformação de posição (--pos-tf) para os
     widgets centralizados não pularem durante a animação. */
  .widget.visible.wanim-fade { animation: fadeIn var(--in-dur, 0.45s) ease-out; }
  .widget.visible.wanim-slide-up { animation: wSlideUp var(--in-dur, 0.4s) cubic-bezier(0.2, 0.9, 0.3, 1.15); }
  @keyframes wSlideUp { from { opacity: 0; transform: var(--pos-tf, none) translateY(60px); } to { transform: var(--pos-tf, none); } }
  .widget.visible.wanim-slide-down { animation: wSlideDown var(--in-dur, 0.4s) cubic-bezier(0.2, 0.9, 0.3, 1.15); }
  @keyframes wSlideDown { from { opacity: 0; transform: var(--pos-tf, none) translateY(-60px); } to { transform: var(--pos-tf, none); } }
  .widget.visible.wanim-slide-left { animation: wSlideLeft var(--in-dur, 0.4s) cubic-bezier(0.2, 0.9, 0.3, 1.15); }
  @keyframes wSlideLeft { from { opacity: 0; transform: var(--pos-tf, none) translateX(-80px); } to { transform: var(--pos-tf, none); } }
  .widget.visible.wanim-slide-right { animation: wSlideRight var(--in-dur, 0.4s) cubic-bezier(0.2, 0.9, 0.3, 1.15); }
  @keyframes wSlideRight { from { opacity: 0; transform: var(--pos-tf, none) translateX(80px); } to { transform: var(--pos-tf, none); } }
  .widget.visible.wanim-pop { animation: wPop var(--in-dur, 0.3s) cubic-bezier(0.2, 1.4, 0.4, 1); }
  @keyframes wPop { from { opacity: 0; transform: var(--pos-tf, none) scale(0.6); } to { transform: var(--pos-tf, none); } }
  .widget.visible.wanim-zoom { animation: wZoom var(--in-dur, 0.4s) cubic-bezier(0.2, 0.9, 0.3, 1); }
  @keyframes wZoom { from { opacity: 0; transform: var(--pos-tf, none) scale(2.2); } to { transform: var(--pos-tf, none); } }
  .widget.visible.wanim-bounce { animation: wBounce var(--in-dur, 0.7s) ease-out; }
  @keyframes wBounce {
    0% { opacity: 0; transform: var(--pos-tf, none) translateY(-220px); }
    45% { opacity: 1; transform: var(--pos-tf, none) translateY(0); }
    62% { transform: var(--pos-tf, none) translateY(-32px); }
    78% { transform: var(--pos-tf, none) translateY(0); }
    89% { transform: var(--pos-tf, none) translateY(-10px); }
    100% { transform: var(--pos-tf, none) translateY(0); }
  }
  .widget.visible.wanim-flip { animation: wFlip var(--in-dur, 0.5s) cubic-bezier(0.2, 0.9, 0.3, 1.1); }
  @keyframes wFlip { from { opacity: 0; transform: var(--pos-tf, none) perspective(700px) rotateY(90deg); } to { transform: var(--pos-tf, none); } }
  .widget.visible.wanim-spin { animation: wSpin var(--in-dur, 0.5s) cubic-bezier(0.2, 0.9, 0.3, 1.1); }
  @keyframes wSpin { from { opacity: 0; transform: var(--pos-tf, none) rotate(-360deg) scale(0.3); } to { transform: var(--pos-tf, none); } }
  .widget.visible.wanim-blur { animation: blurIn var(--in-dur, 0.55s) ease-out; }

  /* ---------- Animações em loop (sai e volta, repetindo) ---------- */
  .loop-pulse { animation: loopPulse var(--loop-dur, 3s) ease-in-out infinite; }
  @keyframes loopPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
  .loop-glow { animation: loopGlow var(--loop-dur, 3s) ease-in-out infinite; }
  @keyframes loopGlow {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.45) drop-shadow(0 0 14px rgba(255,255,255,0.55)); }
  }
  .loop-breathe { animation: loopBreathe var(--loop-dur, 3s) ease-in-out infinite; }
  @keyframes loopBreathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }
  .loop-float { animation: loopFloat var(--loop-dur, 3s) ease-in-out infinite; }
  @keyframes loopFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
  .loop-sway { animation: loopSway var(--loop-dur, 3s) ease-in-out infinite; }
  @keyframes loopSway { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(10px); } 75% { transform: translateX(-10px); } }
  .loop-wiggle { animation: loopWiggle var(--loop-dur, 3s) ease-in-out infinite; }
  @keyframes loopWiggle { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(2deg); } 75% { transform: rotate(-2deg); } }
  .loop-bounce { animation: loopBounce var(--loop-dur, 3s) ease-in-out infinite; }
  @keyframes loopBounce {
    0%, 25%, 55%, 80%, 100% { transform: translateY(0); }
    40% { transform: translateY(-18px); }
    68% { transform: translateY(-8px); }
  }
  .loop-spin { animation: loopSpin var(--loop-dur, 3s) linear infinite; }
  @keyframes loopSpin { to { transform: rotate(360deg); } }
  .loop-flip { animation: loopFlip var(--loop-dur, 3s) ease-in-out infinite; }
  @keyframes loopFlip {
    0%, 55% { transform: perspective(700px) rotateY(0deg); }
    100% { transform: perspective(700px) rotateY(360deg); }
  }
  .loop-blur { animation: loopBlur var(--loop-dur, 3s) ease-in-out infinite; }
  @keyframes loopBlur { 0%, 100% { filter: blur(0); } 50% { filter: blur(5px); } }
  .loop-shake { animation: loopShake var(--loop-dur, 3s) ease-in-out infinite; }
  @keyframes loopShake {
    0%, 62%, 100% { transform: translateX(0); }
    66% { transform: translateX(-7px); } 70% { transform: translateX(7px); }
    74% { transform: translateX(-5px); } 78% { transform: translateX(5px); }
    82% { transform: translateX(-3px); } 86% { transform: translateX(3px); }
  }

  /* Versões dos widgets: compostas com a posição (--pos-tf) e declaradas por
     último para ganharem da animação de entrada quando o loop assume */
  .widget.visible.loop-pulse { animation: loopPulse var(--loop-dur, 3s) ease-in-out infinite; }
  .widget.visible.loop-glow { animation: loopGlow var(--loop-dur, 3s) ease-in-out infinite; }
  .widget.visible.loop-breathe { animation: wLoopBreathe var(--loop-dur, 3s) ease-in-out infinite; }
  @keyframes wLoopBreathe { 0%, 100% { transform: var(--pos-tf, none) scale(1); } 50% { transform: var(--pos-tf, none) scale(1.07); } }
  .widget.visible.loop-float { animation: wLoopFloat var(--loop-dur, 3s) ease-in-out infinite; }
  @keyframes wLoopFloat { 0%, 100% { transform: var(--pos-tf, none) translateY(0); } 50% { transform: var(--pos-tf, none) translateY(-14px); } }
  .widget.visible.loop-sway { animation: wLoopSway var(--loop-dur, 3s) ease-in-out infinite; }
  @keyframes wLoopSway { 0%, 100% { transform: var(--pos-tf, none) translateX(0); } 25% { transform: var(--pos-tf, none) translateX(10px); } 75% { transform: var(--pos-tf, none) translateX(-10px); } }
  .widget.visible.loop-wiggle { animation: wLoopWiggle var(--loop-dur, 3s) ease-in-out infinite; }
  @keyframes wLoopWiggle { 0%, 100% { transform: var(--pos-tf, none) rotate(0deg); } 25% { transform: var(--pos-tf, none) rotate(2deg); } 75% { transform: var(--pos-tf, none) rotate(-2deg); } }
  .widget.visible.loop-bounce { animation: wLoopBounce var(--loop-dur, 3s) ease-in-out infinite; }
  @keyframes wLoopBounce {
    0%, 25%, 55%, 80%, 100% { transform: var(--pos-tf, none) translateY(0); }
    40% { transform: var(--pos-tf, none) translateY(-18px); }
    68% { transform: var(--pos-tf, none) translateY(-8px); }
  }
  .widget.visible.loop-spin { animation: wLoopSpin var(--loop-dur, 3s) linear infinite; }
  @keyframes wLoopSpin { to { transform: var(--pos-tf, none) rotate(360deg); } }
  .widget.visible.loop-flip { animation: wLoopFlip var(--loop-dur, 3s) ease-in-out infinite; }
  @keyframes wLoopFlip {
    0%, 55% { transform: var(--pos-tf, none) perspective(700px) rotateY(0deg); }
    100% { transform: var(--pos-tf, none) perspective(700px) rotateY(360deg); }
  }
  .widget.visible.loop-blur { animation: loopBlur var(--loop-dur, 3s) ease-in-out infinite; }
  .widget.visible.loop-shake { animation: wLoopShake var(--loop-dur, 3s) ease-in-out infinite; }
  @keyframes wLoopShake {
    0%, 62%, 100% { transform: var(--pos-tf, none) translateX(0); }
    66% { transform: var(--pos-tf, none) translateX(-7px); } 70% { transform: var(--pos-tf, none) translateX(7px); }
    74% { transform: var(--pos-tf, none) translateX(-5px); } 78% { transform: var(--pos-tf, none) translateX(5px); }
    82% { transform: var(--pos-tf, none) translateX(-3px); } 86% { transform: var(--pos-tf, none) translateX(3px); }
  }
  /* 🔍 Avatar em destaque (botão direito num avatar do painel) */
  #avatarZoom {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    z-index: 6; display: none; text-align: center; pointer-events: none;
  }
  /* 🎬 v0.81: entrada/saída padrão ÚNICO em todos os overlays — o fade do
     relógio (fadeIn 0.45s na entrada, foFade 0.4s na saída) */
  #avatarZoom.on { display: block; animation: fadeIn 0.45s ease-out; }
  .avatarZoomExtra {
    position: fixed; transform: translate(-50%, -50%);
    z-index: 6; display: block; text-align: center; pointer-events: none;
    animation: fadeIn 0.45s ease-out;
  }
  #avatarZoom.on.saindo, .avatarZoomExtra.saindo, #midiaPublico.on.saindo,
  #midiaTrilha.on.saindo, #midiaDireta.on.saindo {
    animation: foFade 0.4s ease-in forwards;
  }
  .avatarZoomExtra .av-big, .avatarZoomExtra img,
  #avatarZoom .av-big, #avatarZoom img {
    width: var(--avsize, 30vmin); height: var(--avsize, 30vmin);
    border-radius: 50%; border: 0.5vmin solid #fff; object-fit: cover;
    /* ✨ v0.86: a sombra dos overlays é uma só — esta daqui é o PADRÃO dela */
    box-shadow: var(--ov-sombra, 0 1.5vmin 6vmin rgba(0,0,0,0.55));
  }
  #avatarZoom .av-big {
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 800; font-size: calc(var(--avsize, 30vmin) * 0.4);
  }
  #avatarZoom .av-name {
    margin-top: 1vmin; color: #fff; font-weight: 800;
    font-size: calc(var(--avsize, 30vmin) * 0.13);
    text-shadow: 0 0.3vmin 1.2vmin rgba(0,0,0,0.8);
  }

  /* 📎 v0.70: mídia do inscrito na tela do público */
  #midiaPublico { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%);
    z-index: 60; display: none; flex-direction: column; align-items: center; gap: 0.5em;
    pointer-events: none; }
  #midiaPublico.on { display: flex; animation: fadeIn 0.45s ease-out; }
  #midiaPublico img, #midiaPublico video { max-width: 92vw; max-height: var(--midia-alt, 45vh);
    border-radius: 14px; box-shadow: var(--ov-sombra, 0 1.5vmin 6vmin rgba(0,0,0,0.55)); }
  #midiaPublico .midia-rotulo { font-size: 1.3em; color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    background: rgba(0,0,0,0.55); padding: 0.25em 0.7em; border-radius: 0.6em; }
  #midiaPublico.telaCheia { left: 0; top: 0; right: 0; bottom: 0; transform: none;
    background: rgba(0,0,0,0.78); justify-content: center; z-index: 220; }
  #midiaPublico.telaCheia img, #midiaPublico.telaCheia video { max-width: 100vw; max-height: 100vh; border-radius: 0; box-shadow: none; }
  /* 🎧 v0.73: reprodutor bonito de áudio para o público (espelho do painel).
     v0.73.1: no cartão CLÁSSICO ele mora DENTRO do comentário (como no
     WhatsApp); a versão flutuante fica para os moldes/peças. */
  .audio-player { display: flex; align-items: center; gap: 0.55em;
    background: rgba(0, 0, 0, 0.62); border-radius: 999px;
    padding: 0.5em 1.1em 0.5em 0.5em; }
  #midiaPublico .audio-player { width: min(34em, 88vw); box-shadow: var(--ov-sombra, 0 1.5vmin 6vmin rgba(0,0,0,0.55)); }
  .featured .audio-player { width: 100%; margin-top: 0.35em; background: rgba(0, 0, 0, 0.3); }
  .ap-play { width: 2.4em; height: 2.4em; min-width: 2.4em; border-radius: 50%;
    background: var(--card-accent, var(--accent-color, #7c3aed)); color: #fff; line-height: 1;
    display: flex; align-items: center; justify-content: center; }
  /* v0.140.1: a onda é a ÚNICA parte elástica da pílula. Sem o min-width: 0
     ela se recusa a encolher abaixo das 48 barrinhas somadas, e quem paga a
     conta é o relógio, empurrado para fora da pílula (e cortado pelo cartão,
     que recorta o que sai dele). Agora a onda cede espaço e o tempo fica
     sempre inteiro, dentro da pílula. */
  .ap-onda { flex: 1 1 auto; min-width: 0; overflow: hidden;
    display: flex; align-items: center; gap: 0.15em; height: 2.2em; }
  .ap-onda i { flex: 1 1 auto; min-width: 2px; border-radius: 2px; background: rgba(255, 255, 255, 0.35); }
  .ap-onda i.tocada { background: #fff; }
  .ap-tempo { color: #fff; font-size: 0.95em; white-space: nowrap;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8); }
  .audio-player audio { display: none; }
  /* 🎟️ v0.119: figurinha guardada como imagem (Super Sticker) na régua de escala */
  #midiaPublico img.figurinha-midia { height: var(--midia-alt, 45vh); width: auto; max-width: 92vw; object-fit: contain; }
  /* 🌀 v0.74: figurinha animada (Lottie) acompanha a régua de escala */
  #midiaPublico .figurinha-animada { width: var(--midia-alt, 45vh); height: var(--midia-alt, 45vh);
    max-width: 92vw; filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.45)); }
  #midiaPublico .figurinha-animada svg { width: 100%; height: 100%; }

  /* 🖼️🎞️ v0.86: mídia de uma TECLA da Mesa de Trilhas — camada própria
     (não briga com a mídia do inscrito), fade padrão e a sombra dos
     overlays no modo janela; a tela cheia escurece o fundo */
  #midiaTrilha { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%);
    z-index: 62; display: none; flex-direction: column; align-items: center;
    pointer-events: none; }
  #midiaTrilha.on { display: flex; animation: fadeIn 0.45s ease-out; }
  #midiaTrilha img, #midiaTrilha video { max-width: 92vw; max-height: var(--mtr-alt, 45vh);
    border-radius: 14px; box-shadow: var(--ov-sombra, 0 1.5vmin 6vmin rgba(0,0,0,0.55)); }
  #midiaTrilha.telaCheia { left: 0; top: 0; right: 0; bottom: 0; transform: none;
    background: rgba(0,0,0,0.78); justify-content: center; z-index: 222; }
  #midiaTrilha.telaCheia img, #midiaTrilha.telaCheia video { max-width: 100vw; max-height: 100vh; border-radius: 0; box-shadow: none; }

  /* 🎞️ v0.129: «Mídia direta» — imagem/vídeo/áudio/embed que o apresentador
     mostra ao público direto de um link (YouTube, TikTok, Instagram…) ou de
     um arquivo do computador. Camada própria (acima da mídia da tecla), fade
     padrão, sombra dos overlays na janela; a tela cheia escurece o fundo */
  #midiaDireta { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%);
    z-index: 63; display: none; flex-direction: column; align-items: center; gap: 0.5em;
    pointer-events: none; }
  #midiaDireta.on { display: flex; animation: fadeIn 0.45s ease-out; }
  #midiaDireta img, #midiaDireta video { max-width: 92vw; max-height: var(--md-alt, 45vh);
    border-radius: 14px; box-shadow: var(--ov-sombra, 0 1.5vmin 6vmin rgba(0,0,0,0.55)); background: #000; }
  /* 📐 v0.132: --md-prop é a proporção do site (o Instagram e o TikTok são de
     pé); sem ela tudo entrava numa caixa 16:9, com tarja preta e rolagem */
  #midiaDireta iframe { width: min(92vw, calc(var(--md-alt, 45vh) * var(--md-prop, 1.7778))); height: var(--md-alt, 45vh);
    border: 0; border-radius: 14px; box-shadow: var(--ov-sombra, 0 1.5vmin 6vmin rgba(0,0,0,0.55)); background: #000; }
  #midiaDireta .audio-player { width: min(34em, 88vw); box-shadow: var(--ov-sombra, 0 1.5vmin 6vmin rgba(0,0,0,0.55)); }
  #midiaDireta .midia-rotulo { font-size: 1.3em; color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    background: rgba(0,0,0,0.55); padding: 0.25em 0.7em; border-radius: 0.6em; }
  /* 🏷️ v0.136: o crédito de fonte, logo abaixo da mídia — a pílula que a
     camada já usa, com o negrito do nome que fica sob o avatar ampliado */
  #midiaDireta .md-credito { font-size: 1.15em; font-weight: 800; color: #fff;
    text-shadow: 0 2px 8px rgba(0,0,0,0.8); background: rgba(0,0,0,0.55);
    padding: 0.22em 0.7em; border-radius: 0.6em; max-width: 92vw;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #midiaDireta.telaCheia { left: 0; top: 0; right: 0; bottom: 0; transform: none;
    background: rgba(0,0,0,0.78); justify-content: center; z-index: 224; }
  #midiaDireta.telaCheia img, #midiaDireta.telaCheia video { max-width: 100vw; max-height: 100vh; border-radius: 0; box-shadow: none; }
  #midiaDireta.telaCheia iframe { width: 100vw; height: 100vh; border-radius: 0; box-shadow: none; }
</style>
<style id="custom-css"></style>
</head>
<body>
<div id="avatarZoom"></div>
<div id="fullscreenMedia"></div>
<!-- 📎 v0.70: mídia do inscrito para o PÚBLICO — camada própria, funciona em
     qualquer modo do destaque; escala e tela cheia comandadas pelo painel -->
<div id="midiaPublico"></div>
<div id="midiaTrilha"></div>
<!-- 🎞️ v0.129: mídia direta (link/arquivo) para o PÚBLICO — o painel comanda -->
<div id="midiaDireta"></div>
<div id="stage" class="pos-bottom-left">
  <div id="featuredSlot"></div>
</div>

<div id="qrWidget" class="widget" data-widget="qr">
  <canvas id="qrCanvas" width="200" height="200"></canvas>
  <div class="qr-name" id="qrName"></div>
</div>

<div id="likemeter" class="widget" data-widget="likemeter">
  <!-- v0.52.1: a % é a estrela do likômetro — fica no MEIO e em destaque -->
  <div class="lm-row">
    <span class="lm-viewers">👀 <span id="lmViewers">—</span></span>
    <span class="lm-pct" id="lmPct">—</span>
    <span class="lm-likes">👍 <span id="lmLikes">—</span></span>
  </div>
  <div class="lm-bar"><div class="lm-fill" id="lmFill"></div></div>
  <div class="lm-label">assistindo agora × likes da live</div>
</div>

<div id="winstreak" class="widget" data-widget="winstreak">
  <span class="ws-icon">🏆</span>
  <span class="ws-label">Solo</span>
  <span class="ws-nums"><span class="ws-wins">0</span>/<span class="ws-record">0</span></span>
</div>

<div id="audienceWidget" class="widget" data-widget="audience"></div>
<div id="avisoWidget" class="widget" data-widget="aviso"></div>
<div id="relogioWidget" class="widget" data-widget="relogio"></div>
<div id="somBloqueadoOv" title="Toque uma vez para o navegador liberar o som">🔇 Toque aqui para liberar o som dos alertas</div>

<div id="raffleWidget" class="widget" data-widget="raffle"><div id="raffleBox" style="display:flex;flex-direction:column;align-items:center;gap:20px"></div></div>

<script src="/i18n.js"></script>
<script src="/render.js"></script>
<script>
'use strict';

const stage = document.getElementById('stage');
const featuredSlot = document.getElementById('featuredSlot');
const fullscreenMedia = document.getElementById('fullscreenMedia');
const customStyle = document.getElementById('custom-css');

let settings = null;
let hideTimer = null;
let currentFeaturedId = null;
let currentFeaturedMessage = null;

function hexToRgba(hex, alpha) {
  const match = /^#?([0-9a-f]{6})$/i.exec(hex || '');
  if (!match) return hex;
  const n = parseInt(match[1], 16);
  return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${alpha})`;
}

function mediaElement(url, className) {
  url = String(url || ''); // 🔒 v0.127.1: sem endereço não há mídia
  if (!url) return null;
  const lower = url.toLowerCase().split('?')[0];
  const isVideo = /\.(mp4|webm|ogg|ogv|mov|m4v|avi|mkv)$/.test(lower);
  let el;
  if (isVideo) {
    el = document.createElement('video');
    el.autoplay = true;
    el.loop = true;
    el.muted = true;
    el.playsInline = true;
    el.src = url;
  } else {
    el = document.createElement('img');
    el.src = url;
  }
  if (className) el.className = className;
  return el;
}

function applySettings(next) {
  settings = next;
  // 📺 v0.50: esta é a tela do PÚBLICO (fonte do OBS) — ela segue o idioma
  // escolhido nas configurações, sem tocar na escolha pessoal do navegador
  if (window.OBS_I18N) OBS_I18N.seguir(settings.idioma);
  const root = document.documentElement.style;
  root.setProperty('--accent-color', settings.accentColor);
  root.setProperty('--bg-color', hexToRgba(settings.bgColor, settings.bgOpacity));
  root.setProperty('--text-color', settings.textColor);
  root.setProperty('--font-family', settings.fontFamily);
  root.setProperty('--font-size', settings.fontSize + 'px');
  root.setProperty('--max-width', settings.maxWidth + 'px');
  root.setProperty('--border-radius', settings.borderRadius + 'px');
  root.setProperty('--pad-scale', (Number(settings.paddingScale) || 100) / 100);
  root.setProperty('--f-scale', (Number(settings.scale) || 100) / 100);
  // Velocidades do destaque so valem dentro do palco (nao vazam para os widgets)
  if (Number(settings.animationSeconds) > 0) stage.style.setProperty('--in-dur', clampSecs(settings.animationSeconds, 1, 15) + 's');
  else stage.style.removeProperty('--in-dur');
  if (Number(settings.animationOutSeconds) > 0) stage.style.setProperty('--out-dur', clampSecs(settings.animationOutSeconds, 1, 15) + 's');
  else stage.style.removeProperty('--out-dur');
  root.setProperty('--accent-bar', (Number(settings.accentBarWidth) || 0) + 'px');
  root.setProperty('--media-opacity', Number.isFinite(Number(settings.mediaOpacity)) ? settings.mediaOpacity : 1);
  stage.className = 'pos-' + (settings.position || 'bottom-left');
  // Posicao livre (arrastada no editor de tela do painel). O ponto salvo é o
  // canto da caixinha do editor; o cartão real ancora pelo CENTRO dela, para
  // uma mensagem longa crescer para os lados sem sair do lugar escolhido.
  if (settings.position === 'custom') {
    // fixed (e não absolute): o #stage tem 40px de respiro, mas a posição
    // livre é % da TELA INTEIRA — igualzinho à caixinha do editor. O left
    // fica no CANTO (senão o shrink-to-fit encolheria o cartão perto da
    // borda direita); o translate leva o centro do cartão ao centro da
    // caixinha, e o vw/px vivo acompanha resize sem re-render.
    const m = obsMeiaCaixaCss('featured', settings, true);
    featuredSlot.style.position = 'fixed';
    featuredSlot.style.left = (Number(settings.posX) || 0) + '%';
    featuredSlot.style.top = (Number(settings.posY) || 0) + '%';
    featuredSlot.style.transform = `translate(calc(${m.x} - 50%), calc(${m.y} - 50%))`;
  } else {
    featuredSlot.style.position = '';
    featuredSlot.style.left = '';
    featuredSlot.style.top = '';
    featuredSlot.style.transform = '';
  }

  document.body.classList.toggle('card-shadow', !!settings.cardShadow);
  document.body.classList.toggle('text-shadow', !!settings.textShadow);

  // ✨ v0.86: a sombra que contorna os overlays flutuantes é UMA só, com
  // tipo e opacidade ajustáveis — o padrão é a do 🔍 mostrar avatar
  {
    const sb = settings.sombra || {};
    const op = Math.max(0, Math.min(100, Number(sb.opacidade ?? 55))) / 100;
    const tipos = {
      suave: `0 1.5vmin 6vmin rgba(0,0,0,${op})`,
      contorno: `0 0 0 0.45vmin rgba(0,0,0,${op}), 0 0.8vmin 2.5vmin rgba(0,0,0,${Math.round(op * 60) / 100})`,
      nenhuma: 'none',
    };
    document.documentElement.style.setProperty('--ov-sombra', tipos[sb.tipo] || tipos.suave);
  }
  document.body.classList.remove('avatar-circle', 'avatar-rounded', 'avatar-square');
  document.body.classList.add('avatar-' + (settings.avatarShape || 'circle'));

  // Moldura em tela inteira (posicao e tamanho livres, ajustados no editor 🖱️)
  fullscreenMedia.innerHTML = '';
  // 🖼️ v0.55: a arte própria é recurso de primeira — sem interruptor
  if (settings.mediaFullscreen) {
    fullscreenMedia.appendChild(mediaElement(settings.mediaFullscreen));
  }
  fullscreenMedia.style.left = (Number(settings.mediaX) || 0) + '%';
  fullscreenMedia.style.top = (Number(settings.mediaY) || 0) + '%';
  fullscreenMedia.style.width = (Number(settings.mediaScale) || 100) + '%';
  fullscreenMedia.style.height = (Number(settings.mediaScale) || 100) + '%';
  updateFullscreenVisibility();

  applyWidgets();

  const widgetCSS = Object.values(settings.widgets || {}).map((w) => String(w.customCSS || '')).join('\n');
  customStyle.textContent = String(settings.customCSS || '') + '\n' + widgetCSS;

  renderMidiaPublico(); // 📎 escala/tela cheia da mídia acompanham na hora

  // Redesenha o destaque que ja esta na tela para refletir a mudanca na hora
  if (currentFeaturedId && currentFeaturedMessage) {
    const card = buildFeatured(currentFeaturedMessage);
    if (currentFeaturedMessage.previa === true) card.classList.add('featured--previa'); // 📺 v0.103
    card.classList.remove(...ANIMATIONS.map((a) => 'anim-' + a));
    featuredSlot.innerHTML = '';
    featuredSlot.appendChild(card);
    startFeaturedLoop(card);
  }
}

// ---------- Loop do comentario em destaque ----------
let featuredLoopTimers = [];
function startFeaturedLoop(card) {
  featuredLoopTimers.forEach(clearTimeout);
  featuredLoopTimers = [];
  const loop = settings?.loopAnimation || 'none';
  if (loop === 'none' || !LOOPS.includes(loop)) return;
  const entryMs = settings.animation && settings.animation !== 'none' ? customMs(settings.animationSeconds, 700) : 0;
  featuredLoopTimers.push(setTimeout(() => {
    if (!card.parentNode) return;
    card.classList.remove(...ANIMATIONS.map((a) => 'anim-' + a));
    card.style.setProperty('--loop-dur', clampSecs(settings.loopSeconds || 3, 1, 15) + 's');
    card.classList.add('loop-' + loop);
    const total = clampSecs(settings.loopDurationSeconds, 0, 3600);
    if (total > 0) featuredLoopTimers.push(setTimeout(() => card.classList.remove('loop-' + loop), total * 1000));
  }, entryMs + 60));
}

// ---------- Estilo dos widgets (posicao, cores, escala, midia, CSS) ----------
const WPOS = ['top-left','top-center','top-right','middle-left','center','middle-right','bottom-left','bottom-center','bottom-right'];
// Vocabulário único de animações: entrada e saída oferecem exatamente os
// mesmos efeitos, e o loop tem a lista completa. Vale para o destaque, para
// os widgets e para o chat ao vivo fixo (public/chat.html usa as mesmas).
const ANIMATIONS = ['fade','slide-up','slide-down','slide-left','slide-right','pop','zoom','bounce','flip','spin','blur'];
const ANIM_OUT = ANIMATIONS;
const LOOPS = ['pulse','glow','breathe','float','sway','wiggle','bounce','spin','flip','blur','shake'];

// Duracao escolhida pelo usuario (1-15s) ou o padrao rapido quando 0
const clampSecs = (v, min, max) => Math.max(min, Math.min(max, Number(v) || 0));
function customMs(value, fallbackMs) {
  const secs = clampSecs(value, 0, 15);
  return secs > 0 ? secs * 1000 : fallbackMs;
}

// ---------- Animacao em loop (sai e volta, repetindo) ----------
const loopTimers = new WeakMap();

function clearWidgetLoop(el) {
  delete el.dataset.loopArmed;
  for (const t of loopTimers.get(el) || []) clearTimeout(t);
  loopTimers.delete(el);
  el.classList.remove(...LOOPS.map((l) => 'loop-' + l));
}

function armWidgetLoop(el, kind) {
  const conf = confFor(el) || {};
  const loop = conf.loopAnimation || 'none';
  if (loop === 'none' || !LOOPS.includes(loop)) { clearWidgetLoop(el); return; }
  if (el.dataset.loopArmed) return; // ja esta rodando (ou agendado)
  el.dataset.loopArmed = '1';
  const timers = [];
  // Espera a animacao de entrada terminar antes de comecar o loop
  const entryMs = conf.animation && conf.animation !== 'none' ? customMs(conf.animationSeconds, 700) : 0;
  timers.push(setTimeout(() => {
    el.style.setProperty('--loop-dur', clampSecs(conf.loopSeconds || 3, 1, 15) + 's');
    el.classList.add('loop-' + loop);
    const total = clampSecs(conf.loopDurationSeconds, 0, 3600);
    if (total > 0) timers.push(setTimeout(() => el.classList.remove('loop-' + loop), total * 1000));
  }, entryMs + 60));
  loopTimers.set(el, timers);
}

// ---------- Esconder widgets com animacao de saida ----------
function clearWidgetLeaving(el) {
  delete el.dataset.leaving;
  // 🔒 v0.127.1: a saída anterior (ainda no meio) não pode esconder o widget que voltou
  if (el._hideTimer) { clearTimeout(el._hideTimer); el._hideTimer = null; }
  el.classList.remove(...ANIM_OUT.map((a) => 'wout-' + a));
}

function showWidgetEl(el, kind) {
  clearWidgetLeaving(el);
  el.classList.add('visible');
  if (kind) armWidgetLoop(el, kind);
  // 🧩 v0.96: agora que ele tem tamanho de verdade, dá para saber se alguma
  // peça dele passa da borda (e o recorte precisa cair)
  requestAnimationFrame(() => atualizarRecorteDoWidget(el));
}

function hideWidgetEl(el, kind) {
  clearWidgetLoop(el);
  if (!el.classList.contains('visible')) { clearWidgetLeaving(el); return; }
  if (el.dataset.leaving) return;
  const conf = confFor(el) || {};
  const anim = conf.animationOut || 'fade';
  if (anim === 'none' || !settings) {
    el.classList.remove('visible');
    return;
  }
  el.dataset.leaving = '1';
  el.classList.add('wout-' + anim);
  el._hideTimer = setTimeout(() => {
    el._hideTimer = null;
    clearWidgetLeaving(el);
    el.classList.remove('visible');
  }, customMs(conf.animationOutSeconds, 520) + 80);
}

// Configuracao efetiva de um widget: a da familia, e nos adicionais o
// estilo proprio da instancia por cima (100% independente quando editado).
function confFor(el) {
  const family = (settings?.widgets || {})[el.dataset.widget];
  if (!family) return null;
  if (el.dataset.extra === '1') {
    // 📢 v0.128: o aviso também tem adicionais com estilo próprio
    const listas = { qr: qrList, winstreak: winstreakList, aviso: avisoList };
    const list = listas[el.dataset.widget];
    const inst = (list || []).find((o) => o.id === el.dataset.instance);
    return { ...family, ...(inst?.style || {}) };
  }
  return family;
}

// 🪟 Camadas: a ordem de empilhamento é escolhida no 🖱️ Organizar a tela
// (aba Camadas). O padrão reproduz o comportamento de sempre: a moldura do
// usuário embaixo, o destaque em cima dela e os widgets por cima de tudo.
const CAMADAS_PADRAO = ['media', 'featured', 'qr', 'raffle', 'likemeter', 'winstreak', 'audience', 'aviso', 'relogio'];
function ordemDasCamadas() {
  const bruta = Array.isArray(settings?.layers?.ordem) ? settings.layers.ordem : [];
  const ordem = bruta.filter((c) => CAMADAS_PADRAO.includes(c));
  for (const c of CAMADAS_PADRAO) if (!ordem.includes(c)) ordem.push(c);
  return ordem; // de baixo para cima
}
function aplicarCamadas() {
  const ordem = ordemDasCamadas();
  const zDe = (chave) => 10 + ordem.indexOf(chave);
  fullscreenMedia.style.zIndex = zDe('media');
  stage.style.zIndex = zDe('featured');
  for (const el of document.querySelectorAll('.widget')) {
    el.style.zIndex = zDe(el.dataset.widget);
  }
}

// 🧩 Widgets desmontados: com "peças soltas" ligado num widget, ele vira uma
// caixa fixa e cada parte dele é posicionada/ajustada por conta própria. As
// regras entram numa folha de estilo dinâmica — assim elas sobrevivem aos
// re-desenhos dos widgets (relógio, sorteio e cia. reescrevem o próprio HTML).
const PECAS_WIDGETS_SEL = {
  qr: { codigo: 'canvas', titulo: '.qr-name' },
  likemeter: { numeros: '.lm-row', barra: '.lm-bar', rotulo: '.lm-label' },
  winstreak: { icone: '.ws-icon', rotulo: '.ws-label', numeros: '.ws-nums' },
  audience: { total: '.aud-total', redes: '.aud-rows' },
  relogio: { hora: '.rl-hora', legenda: '.rl-data, .rl-rotulo' },
  raffle: { titulo: '.raffle-title', podio: '.podium, .raffle-spinner' },
};
// 🎯 v0.104: como cada peça de widget centraliza o conteúdo quando ganha uma
// caixa — 'flex' = vira uma caixa centrada (textos, ícone, números);
// 'coluna' = as fileiras centram na horizontal (já é coluna flex); 'linha' =
// os degraus do pódio centram (já é linha flex, base alinhada). O QR (canvas),
// a barra e a fileira de números do likômetro (que espalha 👀 e 👍 pelas
// pontas) preenchem a caixa e ficam como estão.
const PECAS_WIDGETS_CENTRO = {
  'qr.titulo': 'flex', 'likemeter.rotulo': 'flex', 'winstreak.icone': 'flex', 'winstreak.rotulo': 'flex',
  'winstreak.numeros': 'flex', 'relogio.hora': 'flex', 'relogio.legenda': 'flex', 'raffle.titulo': 'flex',
  'audience.total': 'flex', 'audience.redes': 'coluna', 'raffle.podio': 'linha',
};
const pecasWidgetsCss = document.createElement('style');
document.head.appendChild(pecasWidgetsCss);

// O ajuste fino de qualquer peça, como declarações CSS
// ✍️ v0.109: a formatação de TEXTO (formatoDaPeca) mora no render.js desde a
// v0.110 — o chat fixo usa a mesma régua.
function finoDaPeca(p, comEscala) {
  const d = [];
  const t = [];
  if (Number(p.rotacao)) t.push(`rotate(${Number(p.rotacao)}deg)`);
  if (p.espelhar === true) t.push('scaleX(-1)');
  if (comEscala && Number(p.escala) && Number(p.escala) !== 100) t.push(`scale(${Number(p.escala) / 100})`);
  if (t.length) d.push(`transform: ${t.join(' ')}`, 'transform-origin: center');
  if (Number(p.opacidade) > 0 && Number(p.opacidade) < 100) d.push(`opacity: ${Number(p.opacidade) / 100}`);
  if (p.sombra === true) d.push('filter: drop-shadow(0 2px 6px rgba(0,0,0,0.8))');
  return d;
}

function aplicarPecasDosWidgets() {
  const regras = [];
  // ✍️ v0.112: a formatação de texto entra com !important e desce aos filhos
  // (fonte, peso, itálico, maiúsculas, espaçamento, contorno, cor) — o CSS
  // próprio de cada widget (#relogioWidget .rl-hora { font-weight: 800 },
  // a cor dos 👀/👍 do likômetro...) vencia a regra da peça, e «Negrito: Não»
  // ou a cor escolhida não chegavam à letra. Alinhar/sublinhar ficam só na
  // caixa da peça.
  const regrasDeTexto = (p, corOk) => {
    const fmt = formatoDaPeca(p);
    const deCaixa = fmt.filter((x) => /^(text-align|justify-content|text-decoration)/.test(x));
    const herd = fmt.filter((x) => !/^(text-align|justify-content|text-decoration)/.test(x));
    const cor = corOk ? [`color: ${corOk}`] : [];
    const imp = (arr) => arr.map((x) => x + ' !important');
    return { noEl: imp([...herd, ...deCaixa, ...cor]), nosFilhos: imp([...herd, ...cor]) };
  };
  for (const [kind, sels] of Object.entries(PECAS_WIDGETS_SEL)) {
    const conf = settings?.widgets?.[kind];
    if (!conf) continue;
    const livre = conf.pecasLivre === true;
    const alvo = `.widget[data-widget="${kind}"]`;
    // 🐛 v0.96: a caixa das peças só vale para o widget que ESTÁ na tela
    // (.visible). Sem isso, ligar o 🧩 «Overlay em peças» punha um display
    // block em todo widget com peças soltas e fazia até os DESLIGADOS
    // aparecerem na live — 8 de uma vez, no meio da transmissão.
    if (livre) regras.push(`${alvo}.visible { display: block; box-sizing: border-box; width: ${Number(conf.pecasLargura) || 300}px; height: ${Number(conf.pecasAltura) || 200}px; }`);
    for (const [chave, sel] of Object.entries(sels)) {
      const p = (conf.pecas || {})[chave] || {};
      const seletores = sel.split(',').map((x) => `${alvo} ${x.trim()}`).join(', ');
      const corOk = /^#[0-9a-f]{6}$/i.test(String(p.cor || '')) ? p.cor : '';
      // ✍️ v0.110: fora do modo peças (o widget nos presets de sempre) a
      // formatação da letra e a cor da peça VALEM do mesmo jeito — só a
      // posição, a caixa e o mostrar/esconder são coisa do modo solto
      const seletoresFilhos = sel.split(',').map((x) => `${alvo} ${x.trim()} *`).join(', ');
      const texto = regrasDeTexto(p, corOk);
      if (!livre) {
        if (texto.noEl.length) regras.push(`${seletores} { ${texto.noEl.join('; ')}; }`);
        if (texto.nosFilhos.length) regras.push(`${seletoresFilhos} { ${texto.nosFilhos.join('; ')}; }`);
        continue;
      }
      if (p.mostrar === false) { regras.push(`${seletores} { display: none; }`); continue; }
      const d = ['position: absolute', `left: ${Number(p.x) || 0}%`, `top: ${Number(p.y) || 0}%`, 'margin: 0', `z-index: ${1 + (Number(p.z) || 0)}`, ...finoDaPeca(p, true)];
      // 📐 v0.98: a altura também vale — antes só a largura era aplicada, e
      // por isso o seletor de altura das peças dos widgets não fazia nada
      if (Number(p.larg)) d.push(`width: ${Number(p.larg)}%`);
      if (Number(p.alt)) d.push(`height: ${Number(p.alt)}%`);
      // 🎯 v0.104: peça com caixa escolhida centraliza o conteúdo nela (texto
      // e filhos), em vez de encostar na esquerda/no alto
      if (Number(p.larg) || Number(p.alt)) {
        const modo = PECAS_WIDGETS_CENTRO[`${kind}.${chave}`];
        if (modo === 'flex') d.push('display: flex', 'align-items: center', 'justify-content: center', 'text-align: center');
        else if (modo === 'coluna') d.push('align-items: center', 'text-align: center');
        else if (modo === 'linha') d.push('justify-content: center');
      }
      // a formatação (e a cor) por ÚLTIMO, com !important: vence a
      // centralização de cima (text-align) e o CSS próprio do widget
      d.push(...texto.noEl);
      regras.push(`${seletores} { ${d.join('; ')}; }`);
      // Cor e letra escolhidas vencem as dos filhos (👀 e 👍, contagens...)
      if (texto.nosFilhos.length) regras.push(`${seletoresFilhos} { ${texto.nosFilhos.join('; ')}; }`);
    }
  }
  pecasWidgetsCss.textContent = regras.join('\n');
  // 🧩 v0.94: a mesma correção do cartão vale para TODOS os overlays — cada
  // widget para de recortar quando uma peça dele passa da borda. É medido no
  // quadro seguinte (a folha de estilo acabou de mudar) e widget por widget:
  // quem está com tudo dentro continua recortando, como sempre foi.
  requestAnimationFrame(() => {
    for (const el of document.querySelectorAll('.widget')) atualizarRecorteDoWidget(el);
  });
}

// v0.96: a conta precisa ser refeita quando o widget ENTRA na tela, não só
// quando os ajustes mudam — um widget escondido mede 0×0 e nunca "escapava"
function atualizarRecorteDoWidget(el) {
  if (!el || !el.isConnected) return;
  const kind = el.dataset.widget;
  const solto = settings?.widgets?.[kind]?.pecasLivre === true && pecaEscapaDoWidget(el);
  el.classList.toggle('widget--solto', solto);
}

// Alguma peça deste widget passou da borda dele? (o recorte não muda o
// tamanho de layout das peças, então o retângulo delas conta a verdade)
function pecaEscapaDoWidget(el) {
  const r = el.getBoundingClientRect();
  if (r.width < 2 || r.height < 2) return false;
  for (const filho of el.children) {
    const f = filho.getBoundingClientRect();
    if (f.width < 1 && f.height < 1) continue;
    if (f.left < r.left - 1 || f.top < r.top - 1
      || f.right > r.right + 1 || f.bottom > r.bottom + 1) return true;
  }
  return false;
}

function applyWidgets() {
  aplicarCamadas();
  aplicarPecasDosWidgets();
  for (const el of document.querySelectorAll('.widget')) {
    const conf = confFor(el);
    if (!conf) continue;
    for (const pos of WPOS) el.classList.remove('wpos-' + pos);
    if (el.dataset.extra === '1') {
      // Widgets adicionais tem posicao propria (por instancia), aplicada
      // pelo renderizador — aqui so herdam cores, escala e animacao. A
      // meia-caixa da ancora acompanha a familia (escala/pecas) a cada
      // settings, senao mudar o tamanho da familia deixaria o adicional
      // ancorado na conta velha ate o proximo evento qr/winstreak.
      const m = obsMeiaCaixaCss(el.dataset.widget, settings, false);
      el.style.setProperty('--pos-tf', `translate(calc(${m.x} - 50%), calc(${m.y} - 50%))`);
    } else if (conf.position === 'custom') {
      // Posicao livre em % da tela (arrastada no editor): o left fica no
      // CANTO da caixinha (shrink-to-fit usa o left — centrar por left
      // encolheria o widget na metade direita da tela) e o translate leva o
      // centro do widget ao centro da caixinha. A meia-caixa sai SEM escala:
      // o zoom do proprio widget multiplica o transform (centro final =
      // left + zoom × meiaCaixa), e vw/px vivos acompanham o resize.
      const m = obsMeiaCaixaCss(el.dataset.widget, settings, false);
      el.style.left = (Number(conf.x) || 0) + '%';
      el.style.top = (Number(conf.y) || 0) + '%';
      el.style.right = 'auto';
      el.style.bottom = 'auto';
      el.style.transform = '';
      el.style.setProperty('--pos-tf', `translate(calc(${m.x} - 50%), calc(${m.y} - 50%))`);
    } else {
      el.classList.add('wpos-' + (conf.position || 'top-left'));
      el.style.left = '';
      el.style.top = '';
      el.style.right = '';
      el.style.bottom = '';
      el.style.transform = '';
      el.style.removeProperty('--pos-tf');
    }
    for (const anim of ANIMATIONS) el.classList.remove('wanim-' + anim);
    const entryAnim = conf.animation || 'fade';
    if (entryAnim !== 'none') el.classList.add('wanim-' + entryAnim);
    el.style.setProperty('--w-bg', hexToRgba(conf.bgColor, conf.bgOpacity));
    el.style.setProperty('--w-text', conf.textColor);
    el.style.setProperty('--w-accent', conf.accentColor);
    el.style.setProperty('--w-radius', (Number(conf.borderRadius) || 0) + 'px');
    if (conf.viewersColor) el.style.setProperty('--w-viewers', conf.viewersColor);
    if (conf.likesColor) el.style.setProperty('--w-likes', conf.likesColor);
    el.style.zoom = (Number(conf.scale) || 100) / 100;
    // Velocidades escolhidas pelo usuario (0 = padrao rapido)
    if (Number(conf.animationSeconds) > 0) el.style.setProperty('--in-dur', clampSecs(conf.animationSeconds, 1, 15) + 's');
    else el.style.removeProperty('--in-dur');
    if (Number(conf.animationOutSeconds) > 0) el.style.setProperty('--out-dur', clampSecs(conf.animationOutSeconds, 1, 15) + 's');
    else el.style.removeProperty('--out-dur');
    el.style.setProperty('--loop-dur', clampSecs(conf.loopSeconds || 3, 1, 15) + 's');
    // Loop pode ter sido ligado/desligado nas configuracoes agora
    if ((conf.loopAnimation || 'none') === 'none') clearWidgetLoop(el);
    else if (el.classList.contains('visible') && !el.dataset.leaving && !el.dataset.loopArmed) armWidgetLoop(el, el.dataset.widget);

    const oldMedia = el.querySelector('.w-media');
    if (oldMedia) oldMedia.remove();
    if (conf.mediaUrl) {
      el.prepend(mediaElement(conf.mediaUrl, 'w-media'));
    }
  }
}

function updateFullscreenVisibility() {
  const show = !!(settings && settings.mediaFullscreen && currentFeaturedId);
  fullscreenMedia.style.display = show ? 'block' : 'none';
}

function accentFor(message) {
  if (isSuperchat(message) && corHexOk(message.superchat?.color)) return corHexOk(message.superchat.color);
  if (settings.accentMode === 'custom') return settings.accentColor;
  return platformColor(message.platform);
}

// ✍️ v0.100 — a cor do NOME de quem comentou, separada da cor de destaque.
// Devolve null no modo 'padrao' (aí o nome segue o destaque, como sempre foi).
// 'author' é a cor que o PRÓPRIO SERVIÇO manda: Twitch e Kick mandam a cor
// que a pessoa escolheu no chat; as outras redes não mandam nada, e nesse
// caso o nome usa a cor da rede em vez de ficar sem cor nenhuma.
function nomeColorFor(message, conf) {
  const c = conf || settings || {};
  const modo = c.nameColorMode || 'padrao';
  if (modo === 'custom') return c.nameColor || '#ffffff';
  if (modo === 'author') return message?.authorColor || platformColor(message?.platform);
  if (modo === 'platform') return platformColor(message?.platform);
  return null;
}

// ---------------------------------------------------------------------------
// 🎙️ v0.140: o que o inscrito FALOU vira o comentário na tela do público.
// O áudio ou o vídeo continua na tela como sempre (do mesmo jeito que a
// imagem); a região do comentário é que passa a mostrar a transcrição. Sem
// transcrição pronta, fica só a marca do tipo de arquivo — assim quem assiste
// sabe o que está tocando em vez de olhar para um cartão vazio.
//
// Aqui só chega o rascunho do que ESTÁ no ar: o servidor manda a transcrição
// do destaque junto do destaque (init/featured) e avisa ao vivo quando uma
// fica pronta. A lista inteira nunca vem para cá.
// ---------------------------------------------------------------------------
const MARCA_DA_MIDIA = { audio: '[mensagem de áudio]', video: '[mensagem de vídeo]' };
const TRANSCRICOES_MAX = 50;
const transcricoesNaTela = new Map(); // url → texto pronto
function guardarTranscricao(info) {
  const url = info && info.url;
  if (!url) return;
  const texto = info.estado === 'ok' ? String(info.texto || '').trim() : '';
  if (!texto) { transcricoesNaTela.delete(url); return; }
  transcricoesNaTela.delete(url); // reentra no fim da fila
  transcricoesNaTela.set(url, texto);
  while (transcricoesNaTela.size > TRANSCRICOES_MAX) {
    transcricoesNaTela.delete(transcricoesNaTela.keys().next().value);
  }
}
// (temComentarioEscrito mora no render.js — o painel usa a MESMA regra)
// A caixa da região do comentário para um áudio/vídeo. Devolve null quando a
// mensagem não traz áudio nem vídeo — aí nada muda no cartão.
function caixaDaTranscricao(message) {
  const mid = message && message.midia;
  const tipo = mid && MARCA_DA_MIDIA[mid.tipo] ? mid.tipo : null;
  if (!tipo || !String(mid.url || '').startsWith('/midia-inscritos/')) return null;
  const el = document.createElement('div');
  el.className = 'ov-transcricao';
  el.dataset.turl = String(mid.url);
  el.dataset.tipo = tipo;
  if (temComentarioEscrito(message)) el.dataset.comTexto = '1';
  pintarTranscricaoNaTela(el);
  return el;
}
function pintarTranscricaoNaTela(el) {
  const texto = transcricoesNaTela.get(el.dataset.turl) || '';
  const comTexto = el.dataset.comTexto === '1';
  el.classList.toggle('ov-transcricao--extra', comTexto && !!texto);
  el.classList.toggle('ov-transcricao--marca', !texto);
  if (texto) {
    // fala de quem assiste: nunca traduzir (o atributo antes do texto, para o
    // motor de idiomas já achar a zona proibida montada)
    el.setAttribute('data-no-i18n', '');
    el.hidden = false;
    el.textContent = texto;
    return;
  }
  // Com um texto escrito junto, o cartão já tem o que ler: sem transcrição
  // pronta a caixa fica só esperando, sem marca nenhuma na tela.
  if (comTexto) { el.hidden = true; el.textContent = ''; return; }
  el.removeAttribute('data-no-i18n'); // a marca é NOSSA: essa, sim, traduz
  el.hidden = false;
  el.textContent = MARCA_DA_MIDIA[el.dataset.tipo] || '';
}
// A transcrição ficou pronta com o cartão já no ar: repinta só a caixa dela —
// remontar o cartão reiniciaria a animação de entrada e o reprodutor do áudio.
function aplicarTranscricaoQueChegou(url) {
  if (!url) return 0;
  let trocados = 0;
  for (const el of Array.from(document.querySelectorAll('.ov-transcricao'))) {
    if (el.dataset.turl !== url) continue;
    pintarTranscricaoNaTela(el);
    trocados += 1;
    // no modo peças, o texto que cresceu precisa caber de novo na caixa
    const peca = el.closest('.peca-texto');
    if (peca) ajustarPeca(peca, (settings.pecas?.texto || {}).ajuste);
  }
  return trocados;
}

// 🧩 Modo peças soltas: monta o cartão como uma caixa fixa com cada peça
// (avatar, ícone, nome, distintivos, valor e texto) na posição escolhida no
// 🖱️ Organizar a tela. O nome e o texto têm o "ajuste": encolher a letra até
// caber, cortar na borda, ou vazar (o cartão ainda recorta o que sair dele).
function buildFeaturedLivre(message, card) {
  card.classList.add('featured--livre');
  card.style.setProperty('--card-h', String(Number(settings.cardAlturaEm) || 4.6));
  const addPeca = (chave, montar) => {
    const p = (settings.pecas || {})[chave];
    if (!p || p.mostrar === false) return null;
    const el = document.createElement('div');
    el.className = 'peca peca-' + chave;
    el.style.left = (Number(p.x) || 0) + '%';
    el.style.top = (Number(p.y) || 0) + '%';
    el.style.fontSize = (Math.max(25, Math.min(1000, Number(p.escala) || 100)) / 100) + 'em';
    // 🖼️ v0.94: a largura escolhida vale como escolhida — o teto antigo
    // (`maxWidth: 100% - x`) espremia qualquer peça que passasse da borda
    if (p.larg) el.style.width = p.larg + '%';
    if (p.alt) el.style.height = p.alt + '%';
    // 📐 v0.98: caixa escolhida = o conteúdo preenche a caixa. Sem isto, o
    // avatar e o ícone (que têm tamanho em "em") ignoravam largura e altura
    if (p.larg || p.alt) el.classList.add('peca--caixa');
    if (p.ajuste) el.classList.add('ajuste-' + p.ajuste);
    // Ajuste fino da peça: rotação, espelhar, opacidade, cor, sombra e borda
    const fino = [];
    if (Number(p.rotacao)) fino.push(`rotate(${Number(p.rotacao)}deg)`);
    if (p.espelhar === true) fino.push('scaleX(-1)');
    if (fino.length) { el.style.transform = fino.join(' '); el.style.transformOrigin = 'center'; }
    if (Number(p.opacidade) > 0 && Number(p.opacidade) < 100) el.style.opacity = String(Number(p.opacidade) / 100);
    if (p.sombra === true) el.style.filter = 'drop-shadow(0 2px 6px rgba(0,0,0,0.8))';
    if (p.cor) el.style.color = p.cor;
    if (Number(p.borda)) el.style.setProperty('--pb', String(Number(p.borda)));
    if (p.bordaCor) el.style.setProperty('--pbc', p.bordaCor);
    // ✍️ v0.109: formatação de texto da peça (fonte, negrito, contorno...)
    for (const decl of formatoDaPeca(p)) {
      const i = decl.indexOf(':');
      el.style.setProperty(decl.slice(0, i).trim(), decl.slice(i + 1).trim());
    }
    el.style.zIndex = String(1 + (Number(p.z) || 0)); // 🥞 quem fica por cima
    const conteudo = document.createElement('div');
    conteudo.className = 'peca-conteudo';
    montar(conteudo);
    el.appendChild(conteudo);
    card.appendChild(el);
    return el;
  };
  const avatarEl = addPeca('avatar', (c) => c.appendChild(avatarElement(message, true))); // foto em alta
  const iconeEl = addPeca('icone', (c) => c.appendChild(platformIcon(message.platform)));
