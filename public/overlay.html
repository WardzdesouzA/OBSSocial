  // 🎯 v0.104: avatar e ícone com caixa escolhida viram um QUADRADO centrado —
  // um lado escolhido = esse lado; os dois = o menor deles. Medido em px de
  // layout (clientWidth/Height ignoram o zoom do cartão), no quadro seguinte.
  const quadrar = (el, chave) => {
    if (!el || !el.isConnected) return;
    const p = (settings.pecas || {})[chave] || {};
    if (!p.larg && !p.alt) { el.style.removeProperty('--quadrado'); return; }
    const W = el.clientWidth, H = el.clientHeight;
    const lado = (p.larg && p.alt) ? Math.min(W, H) : (p.larg ? W : H);
    if (lado > 0) el.style.setProperty('--quadrado', lado + 'px');
  };
  const nomeEl = addPeca('nome', (c) => { c.textContent = message.author; });
  addPeca('selos', (c) => badgeRow(message, (el) => c.appendChild(el), { semValor: true }));
  let valorEl = null;
  if (message.superchat?.amount) {
    valorEl = addPeca('valor', (c) => {
      const amount = document.createElement('span');
      // 💰 v0.109: 'texto' = só o número, sem a pílula colorida
      const comoTexto = ((settings.pecas || {}).valor || {}).estilo === 'texto';
      amount.className = 'sc-amount' + (comoTexto ? ' sc-amount--texto' : '');
      amount.textContent = message.superchat.amount
        + (message.superchat.converted ? ` ≈ ${message.superchat.converted}` : '');
      if (!comoTexto) amount.style.background = corHexOk(message.superchat.color) || '#ffb300';
      // ✍️ v0.112: a formatação e a cor da peça valem também NA PÍLULA — ela
      // tem negrito 800 e preto fixos no CSS, e «Negrito: Não» ou a cor
      // própria não chegavam nela só pela herança
      aplicarFormatoInline(amount, (settings.pecas || {}).valor);
      c.appendChild(amount);
    });
  }
  const textoEl = addPeca('texto', (c) => {
    c.appendChild(renderRuns(message.runs));
    // 🎙️ v0.140: a fala do áudio/vídeo entra na MESMA peça do comentário —
    // ela é o comentário desta mensagem, e anda junto com ele pela tela
    const fala = caixaDaTranscricao(message);
    if (fala) c.appendChild(fala);
  });
  // O encaixe precisa medir o cartão JÁ na tela: roda no quadro seguinte
  requestAnimationFrame(() => {
    quadrar(avatarEl, 'avatar');
    quadrar(iconeEl, 'icone');
    ajustarPeca(nomeEl, (settings.pecas?.nome || {}).ajuste);
    ajustarPeca(textoEl, (settings.pecas?.texto || {}).ajuste);
    ajustarValor(valorEl, (settings.pecas?.valor || {}).ajuste);
    soltarSeAlgumaPecaEscapa(card);
  });
  return card;
}

// 🖼️ v0.94 — alguma peça (o avatar, o nome, a arte...) passou da borda do
// cartão? Então o cartão para de recortar, senão o que sai dele sumia. É
// medido de verdade, depois do encaixe: o recorte não muda o tamanho de
// layout das peças, então o retângulo delas conta a história certa. Cartão
// com tudo dentro continua recortando (o cantinho arredondado de sempre).
function soltarSeAlgumaPecaEscapa(card) {
  if (!card || !card.isConnected || card.classList.contains('featured--arteSolta')) return;
  const rc = card.getBoundingClientRect();
  if (rc.width < 2 || rc.height < 2) return;
  for (const peca of card.children) {
    const r = peca.getBoundingClientRect();
    if (r.width < 1 && r.height < 1) continue;
    if (r.left < rc.left - 1 || r.top < rc.top - 1
      || r.right > rc.right + 1 || r.bottom > rc.bottom + 1) {
      card.classList.add('featured--arteSolta');
      return;
    }
  }
}

// Encolhe o conteúdo da peça até caber na caixa dela (ajuste "encolher").
// Desce em degraus de 7% e para em 30% — abaixo disso não dá para ler.
function ajustarPeca(el, modo) {
  if (!el || !el.isConnected || modo !== 'encolher') return;
  const conteudo = el.querySelector('.peca-conteudo');
  if (!conteudo) return;
  let fator = 1;
  el.style.setProperty('--fit', '1');
  for (let i = 0; i < 20; i++) {
    // 🎯 v0.107: com o conteúdo centrado (caixa flex), o que transborda é o
    // conteúdo dentro da própria caixinha dele — mede os dois
    const cabe = el.scrollHeight <= el.clientHeight + 1 && el.scrollWidth <= el.clientWidth + 1
      && conteudo.scrollWidth <= conteudo.clientWidth + 1 && conteudo.scrollHeight <= conteudo.clientHeight + 1;
    if (cabe || fator <= 0.3) break;
    fator = Math.max(0.3, fator * 0.93);
    el.style.setProperty('--fit', String(fator));
  }
}

// 💰 A etiqueta do valor, quando é do tamanho do conteúdo (largura e altura
// no automático), pode passar da borda direita do cartão numa linha só
// («$5.00 ≈ R$ 27,00») — no encaixe "encolher" a letra diminui até caber.
// 📐 v0.98: isso era feito SEMPRE, e brigava com o Tamanho escolhido no
// editor: a peça crescia e voltava a encolher sozinha. Agora obedece ao
// encaixe da peça, e quem tem caixa própria segue a régua das outras peças.
function ajustarValor(el, modo) {
  if (!el || !el.isConnected) return;
  el.style.setProperty('--fit', '1');
  const p = (settings.pecas || {}).valor || {};
  // 💰 v0.107: valor COM caixa escolhida cabe SEMPRE nela — a caixa é o
  // espaço da arte para o valor, e «$5.00 ≈ R$ 25,88» tem de caber onde
  // «R$ 20,00» coube: a letra encolhe até caber, seja qual for o encaixe
  if (Number(p.larg) || Number(p.alt)) { ajustarPeca(el, 'encolher'); return; }
  if (modo && modo !== 'encolher') return; // "cortar"/"vazar": o tamanho é o pedido
  const card = el.closest('.featured');
  if (!card) return;
  let fator = 1;
  el.style.setProperty('--fit', '1');
  for (let i = 0; i < 20; i++) {
    const borda = card.getBoundingClientRect().right;
    if (el.getBoundingClientRect().right <= borda - 2 || fator <= 0.3) break;
    fator = Math.max(0.3, fator * 0.93);
    el.style.setProperty('--fit', String(fator));
  }
}

function buildFeatured(message) {
  // ☎️ v0.64: no ar, autor que pareça telefone entra mascarado (o número
  // real fica só no painel) — vale para o cartão padrão e o modo em peças
  message = mensagemParaTela(message);
  const card = document.createElement('div');
  card.className = 'featured';
  if (settings.animation && settings.animation !== 'none') card.classList.add('anim-' + settings.animation);

  const accent = accentFor(message);
  card.style.setProperty('--card-accent', accent);
  // ✍️ v0.100: a cor escolhida para o nome (vazia = segue o destaque)
  const corDoNome = nomeColorFor(message);
  if (corDoNome) card.style.setProperty('--card-nome', corDoNome);
  if (isSuperchat(message) && corHexOk(message.superchat?.color)) {
    card.style.setProperty('--card-bg', `color-mix(in srgb, ${corHexOk(message.superchat.color)} 35%, var(--bg-color))`);
  }

  // 🖼️ v0.56.1: arte escolhida = o cartão É a arte, sempre. Ela entra como a
  // PEÇA arte (settings.pecas.arte): posição, tamanho, rotação, opacidade...
  // ajustados no 🖱️ Organizar a tela.
  // 🖼️ v0.102: a arte é uma peça DE VERDADE — nasce no TAMANHO REAL do
  // arquivo (largura e altura no automático = 0), como o avatar e os
  // distintivos nascem do tamanho do próprio conteúdo. Um lado escolhido: o
  // outro segue a proporção. Os dois escolhidos: aí sim ela estica para a
  // caixa (foi pedido). Nada aqui depende do tamanho do cartão padrão nem
  // das outras peças — mover um distintivo não mexe na arte.
  if (settings.mediaCard) {
    const arte = (settings.pecas || {}).arte || {};
    if (arte.mostrar !== false) {
      const el = mediaElement(settings.mediaCard, 'media-layer peca-arte carregando');
      const num = (v, padrao) => (Number.isFinite(Number(v)) ? Number(v) : padrao);
      const larg = Math.max(0, num(arte.larg, 0));
      const alt = Math.max(0, num(arte.alt, 0));
      const esc = Math.max(25, Math.min(1000, num(arte.escala, 100))) / 100;
      el.style.inset = 'auto';
      el.style.maxWidth = 'none';
      el.style.left = num(arte.x, 0) + '%';
      el.style.top = num(arte.y, 0) + '%';
      // Tamanho (%): a mesma régua das outras peças, ancorada no canto da
      // peça. Com caixa escolhida ele multiplica a caixa; no automático
      // (tamanho real) ele amplia o próprio arquivo
      el.style.width = larg > 0 ? (larg * esc) + '%' : 'auto';
      el.style.height = alt > 0 ? (alt * esc) + '%' : 'auto';
      if (!larg && !alt && esc !== 1) el.style.zoom = String(esc);
      const tf = [];
      if (num(arte.rotacao, 0)) tf.push(`rotate(${num(arte.rotacao, 0)}deg)`);
      if (arte.espelhar === true) tf.push('scaleX(-1)');
      if (tf.length) { el.style.transform = tf.join(' '); el.style.transformOrigin = 'center'; }
      const op = num(arte.opacidade, 100);
      if (op > 0 && op < 100) {
        // combina com a "Opacidade da mídia" geral (a régua do Seus overlays)
        const geral = Number.isFinite(Number(settings.mediaOpacity)) ? Number(settings.mediaOpacity) : 1;
        el.style.opacity = String((op / 100) * geral);
      }
      if (arte.sombra === true) el.style.filter = 'drop-shadow(0 2px 6px rgba(0,0,0,0.8))';
      // A arte entra no empilhamento de camadas como qualquer outra peça
      el.style.zIndex = String(1 + (num(arte.z, 0)));
      card.appendChild(el);
      // A arte no tamanho real quase sempre passa do cartão padrão: o recorte
      // sai assim que a medida do arquivo chega (o vídeo só sabe o tamanho
      // depois da ficha técnica; a imagem, depois de carregar)
      const pronta = () => { el.classList.remove('carregando'); soltarSeAlgumaPecaEscapa(card); };
      if (el.tagName === 'VIDEO') {
        if (el.readyState >= 1) pronta(); else el.addEventListener('loadedmetadata', pronta, { once: true });
      } else if (el.complete && el.naturalWidth) pronta();
      else el.addEventListener('load', pronta, { once: true });
      el.addEventListener('error', () => el.classList.remove('carregando'), { once: true });
      // 🖼️ v0.93: caixa desenhada fora do cartão padrão? O cartão para de
      // recortar já — senão a arte sumia ao ser mexida
      const x0 = num(arte.x, 0);
      const y0 = num(arte.y, 0);
      if (x0 < 0 || y0 < 0 || (larg > 0 && x0 + larg * esc > 100) || (alt > 0 && y0 + alt * esc > 100)) {
        card.classList.add('featured--arteSolta');
      }
    }
    // Com os dois lados escolhidos a arte preenche exatamente a caixa (estica
    // se precisar) e o cartão padrão sai de cena: sem fundo, sem barrinha,
    // sem sombra
    card.style.setProperty('--media-fit', 'fill');
    card.classList.add('featured--soArte');
  }

  // 🧩 Peças soltas ligadas OU arte escolhida: o cartão é montado peça a
  // peça — a montagem padrão (avatar, nome, selos em linha) não entra
  if (destaqueEmPecas(settings)) return buildFeaturedLivre(message, card);

  if (settings.showAvatar) card.appendChild(avatarElement(message, true)); // foto em alta

  const body = document.createElement('div');
  body.className = 'body';

  const meta = document.createElement('div');
  meta.className = 'meta';
  if (settings.showPlatformIcon) meta.appendChild(platformIcon(message.platform));
  const author = document.createElement('span');
  author.className = 'author';
  author.textContent = message.author;
  // ✍️ v0.110: a formatação das peças nome/texto/valor vale também no cartão
  // padrão — não só no overlay em peças (é o MESMO ajuste da aba 🎨)
  const pecasFmt = settings.pecas || {};
  aplicarFormatoInline(author, pecasFmt.nome);
  meta.appendChild(author);
  const platformMeta = PLATFORMS[message.platform];
  if (settings.showPlatformIcon && platformMeta) {
    const name = document.createElement('span');
    name.className = 'platform-name';
    name.textContent = '· ' + platformMeta.name;
    meta.appendChild(name);
  }
  // 🕐 v0.50: a hora exata em que o comentário foi feito, para o público
  if (message.timestamp) {
    const hora = document.createElement('span');
    hora.className = 'msg-time';
    hora.textContent = new Date(message.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    meta.appendChild(hora);
  }
  if (message.superchat?.amount) {
    const amount = document.createElement('span');
    amount.className = 'sc-amount';
    amount.textContent = message.superchat.amount
      + (message.superchat.converted ? ` ≈ ${message.superchat.converted}` : '');
    // 💰 v0.110: «Texto simples» também vale no cartão padrão
    if ((pecasFmt.valor || {}).estilo === 'texto') amount.classList.add('sc-amount--texto');
    else amount.style.background = corHexOk(message.superchat.color) || '#ffb300';
    aplicarFormatoInline(amount, pecasFmt.valor);
    meta.appendChild(amount);
  } else if (settings.showBadges) {
    badgeRow(message, (el) => meta.appendChild(el));
  }
  body.appendChild(meta);

  const text = document.createElement('div');
  text.className = 'msg-text';
  text.appendChild(renderRuns(message.runs));
  aplicarFormatoInline(text, pecasFmt.texto);
  body.appendChild(text);

  // 🎙️ v0.140: áudio/vídeo do inscrito? Então a região do comentário mostra o
  // que ele falou (ou a marca do tipo, enquanto não houver transcrição). Vem
  // com a mesma formatação do texto — é o comentário desta mensagem.
  const fala = caixaDaTranscricao(message);
  if (fala) {
    aplicarFormatoInline(fala, pecasFmt.texto);
    body.appendChild(fala);
  }

  // 📎 v0.70: imagem e vídeo vivem na camada própria #midiaPublico (escala e
  // tela cheia comandadas pelo painel). 🎧 v0.73.1: o ÁUDIO volta para dentro
  // do cartão — o comentário vira a bolha com o reprodutor, como no WhatsApp
  // (nos moldes/peças ele segue na camada flutuante).
  const mid = message.midia;
  if (mid && mid.tipo === 'audio' && String(mid.url || '').startsWith('/midia-inscritos/')) {
    body.appendChild(montarAudioBonito(mid));
  }

  card.appendChild(body);
  return card;
}

// 📱 Overlay vertical: /overlay?tela=vertical usa as POSIÇÕES do perfil
// vertical (layoutV); todo o resto (conteúdo, cores, tamanhos) é o mesmo
// do horizontal — linkado de fábrica.
const TELA_V = /[?&]tela=v/i.test(location.search);
// 🎭 v0.55: /overlay?perfil=NOME veste SEMPRE esse molde (ignora o automático).
// É a prévia do modo edição do 🖱️ Organizar — e também serve para quem quer
// uma cena do OBS com um visual fixo, escolhido pela própria URL.
const PERFIL_URL = new URLSearchParams(location.search).get('perfil');
// 📺 v0.103: /overlay?previa=1 é a PRÉVIA do editor (o iframe do 🖱️ Organizar).
// Sem nada no ar, ela mostra um exemplo LOCAL — o comentário que o editor
// entrega por previaExemplo() e, nos widgets desligados, dados de exemplo —
// para o mapa ter sempre o overlay DE VERDADE por baixo das caixinhas. Nada
// disso vai para a live: a tela do OBS abre sem o parâmetro e não sabe de nada.
const PREVIA = /[?&]previa=1/.test(location.search);
let exemploPrevia = null;  // o comentário de exemplo que o editor mandou
let destaqueReal = null;   // o que o servidor diz estar no ar (a live)
let exemploQrPrevia = null; // a matriz do QR de exemplo (vem no init)
const EXEMPLO_PREVIA = {
  aviso: { visible: true, texto: 'Exemplo de aviso na tela 📢 — ajuste a posição e o tamanho por aqui' },
  likemeter: { enabled: true, viewers: 1234, likes: 567, error: null },
  raffle: {
    visible: true, drawnAt: 1, origem: 'exemplo', vez: null, prazoAte: null,
    winners: [
      { author: 'Exemplo da Live', platform: 'twitch', avatar: null, weight: 1 },
      { author: 'Segundo Lugar', platform: 'youtube', avatar: null, weight: 1 },
      { author: 'Terceiro Lugar', platform: 'kick', avatar: null, weight: 1 },
    ],
    respostas: [null, null, null], expirados: [false, false, false],
  },
  audience: { visible: true, platforms: { youtube: { count: 1240 }, twitch: { count: 380 }, kick: { count: 95 } } },
};
function destaqueParaMostrar() {
  if (destaqueReal) return destaqueReal;
  return (PREVIA && exemploPrevia) ? exemploPrevia : null;
}
function mostrarDestaqueAtual() {
  const m = destaqueParaMostrar();
  destaqueNoAr = m;
  aplicarComPerfil(false);
  showFeatured(m);
}
window.previaExemplo = (msg) => {
  exemploPrevia = (PREVIA && msg && typeof msg === 'object') ? { ...msg, previa: true } : null;
  if (PREVIA && settingsBase && !destaqueReal) mostrarDestaqueAtual();
};
function comTela(s) {
  if (!TELA_V || !s) return s;
  const lv = s.layoutV || {};
  const out = JSON.parse(JSON.stringify(s));
  if (lv.featured) {
    if (lv.featured.position) out.position = lv.featured.position;
    if ('posX' in lv.featured) out.posX = lv.featured.posX;
    if ('posY' in lv.featured) out.posY = lv.featured.posY;
  }
  if (lv.media) {
    if ('x' in lv.media) out.mediaX = lv.media.x;
    if ('y' in lv.media) out.mediaY = lv.media.y;
  }
  for (const [chave, v] of Object.entries(lv.widgets || {})) {
    if (!out.widgets?.[chave] || !v) continue;
    if (v.position) out.widgets[chave].position = v.position;
    if ('x' in v) out.widgets[chave].x = v.x;
    if ('y' in v) out.widgets[chave].y = v.y;
  }
  return out;
}

// 🎭 Perfis de overlay (v0.54): a tela guarda as settings CRUAS do servidor
// e, na hora de aplicar, veste o molde do perfil que vale para o destaque
// atual. Tudo síncrono: o navegador só pinta o resultado final, sem piscar.
let settingsBase = null;   // as settings como vieram do servidor
let perfisOverlay = [];    // os moldes salvos
let destaqueNoAr = null;   // a mensagem em destaque (decide o perfil)
let perfilChave = null;    // o snap aplicado por último (para não re-aplicar à toa)

// 🎭 v0.105: na PRÉVIA do editor sem molde aberto, o 🎭 automático NÃO veste
// molde nenhum — a prévia mostra o visual que está sendo editado (o ao vivo),
// senão o mapa editava uma coisa e a tela mostrava outra ("não consigo mover
// o distintivo": o comentário de teste vestia um molde pelo automático). O
// molde que a live vestiria fica disponível para o editor avisar.
const SEM_AUTO_NA_PREVIA = PREVIA && !PERFIL_URL;
window.perfilQueVestiria = () => {
  try {
    const p = settingsBase ? perfilDoDestaque(perfisOverlay, settingsBase.perfilAuto, destaqueNoAr) : null;
    return p ? p.nome : null;
  } catch { return null; }
};
function aplicarComPerfil(forcar) {
  if (!settingsBase) return;
  const perfil = PERFIL_URL
    ? (perfisOverlay.find((p) => p && p.nome === PERFIL_URL) || null)
    : (SEM_AUTO_NA_PREVIA ? null : perfilDoDestaque(perfisOverlay, settingsBase.perfilAuto, destaqueNoAr));
  const chave = perfil ? perfil.nome + '|' + JSON.stringify(perfil.snap) : '';
  // Sem mudança de molde, nada a fazer — um destaque novo não pode reiniciar
  // a arte em vídeo da moldura nem re-desenhar os widgets sem motivo
  if (!forcar && chave === perfilChave) return;
  perfilChave = chave;
  let pronto = comTela(aplicarPerfilNoDestaque(settingsBase, perfil));
  // 📱 v0.62: na tela VERTICAL um molde tem posição PRÓPRIA (posXV/posYV,
  // gravadas na aba 📱 do editor) — ela vence a posição compartilhada do
  // layoutV. Molde sem posição vertical se auto-encaixa: centrado na
  // largura e encostado embaixo, sempre inteiro na tela.
  if (TELA_V && perfil && perfil.snap && destaqueEmPecas(pronto)) {
    const s = perfil.snap;
    pronto.position = 'custom';
    const xv = Number(s.posXV), yv = Number(s.posYV);
    if (Number.isFinite(xv) && Number.isFinite(yv)) {
      pronto.posX = xv; pronto.posY = yv;
    } else {
      const esc = (Number(pronto.scale) || 100) / 100;
      const sw = window.innerWidth || 1080, sh = window.innerHeight || 1920;
      const wPct = (Number(pronto.maxWidth) || 640) * esc / sw * 100;
      const hPct = (Number(pronto.cardAlturaEm) || 4.6) * (Number(pronto.fontSize) || 26) * esc / sh * 100;
      pronto.posX = Math.max(0, (100 - wPct) / 2);
      pronto.posY = Math.max(0, 96 - hPct);
    }
  }
  applySettings(pronto);
}

// 🔍 Avatar em destaque: foto ampliada no centro da tela (ou inicial colorida)
// 🪟 v0.79: o miolo do avatar ampliado (foto/inicial + nome) — usado pelo
// principal e pelas instâncias EXTRAS do modo «várias instâncias»
function montarAvatarZoomEm(box, az) {
  // ☎️ v0.64: o nome ampliado também respeita a máscara de telefone
  if (pareceTelefone(az.author)) az = { ...az, author: nomeParaTela(az.author) };
  box.innerHTML = '';
  box.style.setProperty('--avsize', `${Math.max(10, Math.min(70, Number(az.size) || 30))}vmin`);
  // 🔍 v0.146: https OU foto local (Telegram/WhatsApp e amostras) — antes só
  // o https passava e a foto baixada pelo programa virava inicial colorida
  if (avatarUrlOk(az.url)) {
    const img = document.createElement('img');
    img.alt = '';
    box.appendChild(img);
    // v0.53: desce a escada de qualidades (original → grande → a que veio) e,
    // só se nenhuma carregar, cai na inicial colorida — nunca fica vazio
    avatarComQualidade(img, az.url, () => {
      img.remove();
      const div = document.createElement('div');
      div.className = 'av-big';
      const primeira = Array.from(String(az.author || '?').trim())[0] || '?';
      div.textContent = primeira.toUpperCase();
      div.style.background = colorForName(az.author);
      box.prepend(div);
    });
  } else {
    const div = document.createElement('div');
    div.className = 'av-big';
    const primeira = Array.from(String(az.author || '?').trim())[0] || '?';
    div.textContent = primeira.toUpperCase();
    div.style.background = colorForName(az.author);
    box.appendChild(div);
  }
  const nome = document.createElement('div');
  nome.className = 'av-name';
  nome.textContent = az.author || '';
  // ✍️ v0.100: o nome do avatar em alta segue a mesma cor de nome do destaque
  const corDoNome = nomeColorFor(az);
  if (corDoNome) nome.style.color = corDoNome;
  box.appendChild(nome);
}

// 🎬 v0.81: saída PADRÃO de todo overlay — some com o mesmo fade da entrada
// (nada mais desaparece seco da tela)
function cancelarFade(el) {
  clearTimeout(el._fadeTimer);
  delete el.dataset.saindo;
  el.classList.remove('saindo');
}
function sumirComFade(el, aoFim) {
  if (el.dataset.saindo) return;
  if (!el.classList.contains('on')) { if (aoFim) aoFim(); return; }
  el.dataset.saindo = '1';
  el.classList.add('saindo');
  el._fadeTimer = setTimeout(() => {
    delete el.dataset.saindo;
    el.classList.remove('saindo', 'on');
    if (aoFim) aoFim();
  }, 430);
}

function showAvatarZoom(az) {
  const box = document.getElementById('avatarZoom');
  if (!az || !az.visible) { sumirComFade(box, () => { box.innerHTML = ''; }); return; }
  cancelarFade(box);
  montarAvatarZoomEm(box, az);
  // Reinicia a animação de entrada
  box.classList.remove('on');
  void box.offsetWidth;
  box.classList.add('on');
}

// 🪟 v0.79: instâncias EXTRAS do 🔍 avatar («várias instâncias» ligado) —
// entram em cascata ao lado do principal, cada uma com o próprio tamanho
function showAvatarZooms(lista) {
  const atuais = new Set((lista || []).map((a) => a.id));
  for (const el of document.querySelectorAll('.avatarZoomExtra')) {
    // 🎬 v0.81: a instância fechada sai com o fade padrão, não some seca
    if (atuais.has(el.dataset.azid) || el.dataset.saindo) continue;
    el.dataset.saindo = '1';
    el.classList.add('saindo');
    setTimeout(() => el.remove(), 430);
  }
  (lista || []).forEach((az, i) => {
    let el = document.querySelector(`.avatarZoomExtra[data-azid="${az.id}"]:not(.saindo)`);
    if (!el) {

// 🎧 v0.73: forma de onda real do áudio (decodificada uma vez por arquivo)
const ondasCache = new Map(); // url -> Promise<[alturas 0..1]|null>

const CACHE_MIDIA_MAX = 100;

function ondaDoAudio(url, barras, m) {
  // 🔒 v0.127.1: áudio de mais de 10 min (ou sem duração conhecida e pesado)
  // fica com as barras neutras — decodificar inteiro travaria a tela
  const duracao = Number(m && m.duracao) || 0;
  if (duracao > 600) return Promise.resolve(null);
  if (!ondasCache.has(url)) guardarNoCache(ondasCache, url, (async () => {
    try {
      if (!duracao) {

        if (cabeca && Number(cabeca.headers.get('content-length')) > ONDA_MAX_BYTES) return null;
      }

      const bruto = await resp.arrayBuffer();
      if (bruto.byteLength > ONDA_MAX_BYTES) return null;

      const som = await ctx.decodeAudioData(bruto);

        for (let j = i * bloco, fim = Math.min(dados.length, (i + 1) * bloco); j < fim; j += 32) {
          const v = Math.abs(dados[j]);

      return picos.map((v) => Math.max(0.14, v / teto));

}

  if (PREVIA || !item || !item.url || st.visible !== true || (item.tipo === 'embed' && item.semQuadro)) { esconderMidiaDireta(box); return; }
  cancelarFade(box);
  box.style.setProperty('--md-alt', Math.max(20, Math.min(100, Number(st.escala) || 45)) + 'vh');
  // 📐 v0.132: a proporção que o site pede (retrato no Instagram e no TikTok)
  const prop = Number(item.embed && item.embed.proporcao);
  box.style.setProperty('--md-prop', String(Number.isFinite(prop) && prop > 0.2 && prop < 4 ? prop : 16 / 9));
  box.classList.toggle('telaCheia', st.telaCheia === true);
  const chave = item.id + '|' + item.url;
  // Só reconstrói quando a MÍDIA muda — escala/tela cheia/player não recarregam
  if (box.dataset.chave !== chave) {
    box.innerHTML = '';
    midiaDiretaYt.pronto = false; midiaDiretaYt.tempo = null; midiaDiretaYt.assinatura = ''; zerarConviteYt();
    if (item.tipo === 'imagem') {
      const img = document.createElement('img');
      img.src = item.url; img.alt = item.nome || 'imagem';
      box.appendChild(img);
    } else if (item.tipo === 'video') {
      // 🎛️ sem autoplay nem controles: quem dá play é o painel
      const vi = document.createElement('video');
      vi.src = item.url; vi.playsInline = true; vi.preload = 'auto';
      avisarFimDaMidiaDireta(vi);
      box.appendChild(vi);
    } else if (item.tipo === 'audio') {
      // 🎧 o mesmo reprodutor bonito do público; o <audio> escondido é o motor
      const ap = montarAudioBonito({ url: item.url, nome: item.nome, duracao: item.duracao });
      const au = ap.querySelector('audio');
      if (au) avisarFimDaMidiaDireta(au);
      box.appendChild(ap);
      const selo = document.createElement('span');
      selo.className = 'midia-rotulo';
      selo.textContent = '🎙️ ' + (item.nome || 'áudio');
      box.appendChild(selo);
    } else if (item.tipo === 'embed' && item.embed && item.embed.src) {
      const ifr = document.createElement('iframe');
      let src = String(item.embed.src);
      // A Twitch exige o domínio de quem embute
      if (item.embed.provedor === 'twitch') src += (src.includes('?') ? '&' : '?') + 'parent=' + encodeURIComponent(location.hostname || 'localhost');
      ifr.src = src;
      ifr.setAttribute('allow', 'autoplay; encrypted-media; picture-in-picture; fullscreen');
      ifr.setAttribute('allowfullscreen', '');
      ifr.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
      ifr.setAttribute('scrolling', 'no'); // sem barra de rolagem no embed
      // (sem sandbox: YouTube/TikTok precisam de scripts)
      if (item.embed.provedor === 'youtube') {
        ifr.dataset.yt = '1';
        ifr.addEventListener('load', () => {
          // Assina os eventos do player do YouTube e aplica o estado atual
          try { ifr.contentWindow.postMessage(JSON.stringify({ event: 'listening', id: 'md', channel: 'widget' }), '*'); } catch {}
          midiaDiretaYt.assinatura = '';
          aplicarMidiaDiretaPlayer();
        });
      }
      box.appendChild(ifr);
    } else {
      const selo = document.createElement('span');
      selo.className = 'midia-rotulo';
      selo.textContent = '🎞️ ' + (item.nome || 'mídia');
      box.appendChild(selo);
    }
    box.dataset.chave = chave;
  }
  // 🏷️ v0.136: o crédito de fonte vive fora da reconstrução — ele muda
  // enquanto a mídia continua a mesma (o streamer digitando no painel)
  aplicarCreditoMidiaDireta(box, st.credito);
  box.classList.add('on');
}

// O crédito é o último da coluna, logo abaixo da mídia. Texto vazio ou
// «mostrar» desligado = ninguém vê; e ele nunca reconstrói a mídia.
function aplicarCreditoMidiaDireta(box, credito) {
  const texto = credito && credito.mostrar !== false ? String(credito.texto || '').trim() : '';
  let selo = box.querySelector('.md-credito');
  if (!texto) { if (selo) selo.remove(); return; }
  if (!selo) {
    selo = document.createElement('span');
    selo.className = 'md-credito';
    box.appendChild(selo);
  } else if (selo !== box.lastElementChild) {
    box.appendChild(selo); // a mídia foi refeita: o crédito volta para o fim
  }
  if (selo.textContent !== texto) selo.textContent = texto;
}
// 🏁 O fim de um <video>/<audio> sem loop avisa o servidor (que pausa no
// fim) — UMA vez por reprodução: um seek para o fim dispara 'ended' de novo
function avisarFimDaMidiaDireta(el) {
  el.addEventListener('play', () => { el._fimAvisado = false; });
  el.addEventListener('ended', () => {
    if (el.loop || el._fimAvisado) return;
    el._fimAvisado = true;
    hubOv.send({ type: 'midiaDiretaFim' });
  });
}
// Manda um comando para o iframe do YouTube (IFrame API por postMessage)
function comandarYtDireta(box, func, args) {
  const ifr = box && box.querySelector('iframe[data-yt]');
  if (!ifr || !ifr.contentWindow) return;
  try { ifr.contentWindow.postMessage(JSON.stringify({ event: 'command', func, args: args || [] }), '*'); } catch {}
}
// Espelho do player: volume, velocidade, distorção, loop, posição e
// play/pause vindos do servidor. `doRelogio` = chamada do resync de 500 ms
// (só para <video>/<audio>; o YouTube só recebe comando quando o estado muda)
function aplicarMidiaDiretaPlayer(doRelogio) {
  const box = document.getElementById('midiaDireta');
  const st = midiaDiretaState;
  if (!box || !st || !st.item || st.visible !== true || box.dataset.saindo) return;
  const pl = st.player || {};
  const vol = Number(pl.volume);
  const volume = Math.max(0, Math.min(100, Number.isFinite(vol) ? vol : 100));
  const vel = Number(pl.velocidade);
  const velocidade = Number.isFinite(vel) && vel > 0 ? vel : 1;
  const alvo = posicaoDaMidiaDireta();
  const el = box.querySelector('video') || box.querySelector('audio');
  if (el) {
    el.volume = volume / 100;
    try { el.playbackRate = velocidade; } catch {}
    try { el.preservesPitch = pl.semDistorcao !== false; } catch {}
    el.loop = pl.loop === true;
    // 🏁 no tick do relógio, o vídeo que acabou (sem loop) fica quieto: o
    // servidor já foi avisado e vai pausar — buscar posição de novo faria o
    // 'ended' disparar outra vez, e um play() recomeçaria do zero
    if (doRelogio && el.ended && !el.loop) return;
    // corrige a posição só quando saiu de sincronia (senão o vídeo engasga)
    if (Math.abs((el.currentTime || 0) - alvo) > 0.7) { try { el.currentTime = alvo; } catch {} }
    if (pl.estado === 'tocando') { const p = el.play?.(); if (p?.catch) p.catch(() => {}); }
    else el.pause?.();
    return;
  }
  // ▶️ YouTube: mesmo espelho, por mensagens — e só quando algo mudou
  if (doRelogio) return;
  const ifr = box.querySelector('iframe[data-yt]');
  if (!ifr) return;
  const assinatura = [pl.estado, pl.posicao, pl.em, volume, velocidade, pl.loop === true].join('|');
  if (assinatura === midiaDiretaYt.assinatura) return;
  midiaDiretaYt.assinatura = assinatura;
  if (volume <= 0 || midiaDiretaYt.mudoForcado) comandarYtDireta(box, 'mute');
  else { comandarYtDireta(box, 'unMute'); comandarYtDireta(box, 'setVolume', [Math.round(volume)]); }
  comandarYtDireta(box, 'setPlaybackRate', [velocidade]);
  const conhecida = Number(midiaDiretaYt.tempo);
  if (!Number.isFinite(conhecida) || Math.abs(conhecida - alvo) > 0.7) comandarYtDireta(box, 'seekTo', [alvo, true]);
  comandarYtDireta(box, pl.estado === 'tocando' ? 'playVideo' : 'pauseVideo');
  if (pl.estado === 'tocando') conferirSeYtPegou(box, volume);
  else clearTimeout(ytDesbloqueioTimer);
}
// 🔇 v0.132: dentro do OBS o vídeo começa com som; num navegador comum, o
// «play» sem um toque na página é recusado em silêncio e o YouTube fica
// parado no cartaz. Se em 1,4 s ele não engatou, tocamos no MUDO (isso o
// navegador sempre permite) e acendemos o convite 🔇 — o primeiro toque na
// tela devolve o som, do ponto em que estiver.
function conferirSeYtPegou(box, volume) {
  clearTimeout(ytDesbloqueioTimer);
  if (midiaDiretaYt.mudoForcado) return;
  ytDesbloqueioTimer = setTimeout(() => {
    const pl = (midiaDiretaState && midiaDiretaState.player) || {};
    if (pl.estado !== 'tocando' || midiaDiretaYt.pegou) return;
    midiaDiretaYt.mudoForcado = true;
    comandarYtDireta(box, 'mute');
    comandarYtDireta(box, 'playVideo');
    const convite = document.getElementById('somBloqueadoOv');
    if (volume > 0 && convite && !window.obsstudio) { convite.classList.add('mostrar'); midiaDiretaYt.convite = true; }
  }, 1400);
}
// O primeiro toque (ou tecla) na página: o navegador libera o som e o vídeo
// que estava tocando mudo volta a ter voz
function liberarSomDaMidiaDireta() {
  if (!midiaDiretaYt.mudoForcado) return;
  midiaDiretaYt.mudoForcado = false;
  zerarConviteYt();
  const box = document.getElementById('midiaDireta');
  const pl = (midiaDiretaState && midiaDiretaState.player) || {};
  const vol = Number(pl.volume);
  const volume = Math.max(0, Math.min(100, Number.isFinite(vol) ? vol : 100));
  if (volume <= 0) return;
  comandarYtDireta(box, 'unMute');
  comandarYtDireta(box, 'setVolume', [Math.round(volume)]);
}
function zerarConviteYt() {
  clearTimeout(ytDesbloqueioTimer);
  midiaDiretaYt.pegou = false;
  midiaDiretaYt.mudoForcado = false;
  if (!midiaDiretaYt.convite) return;
  midiaDiretaYt.convite = false;
  const convite = document.getElementById('somBloqueadoOv');
  if (convite) convite.classList.remove('mostrar');
}
document.addEventListener('pointerdown', liberarSomDaMidiaDireta, true);
document.addEventListener('keydown', liberarSomDaMidiaDireta, true);
// Os eventos do player do YouTube chegam como mensagens da janela do iframe
window.addEventListener('message', (ev) => {
  if (ev.origin !== 'https://www.youtube-nocookie.com' && ev.origin !== 'https://www.youtube.com') return;
  let dados = null;
  try { dados = typeof ev.data === 'string' ? JSON.parse(ev.data) : ev.data; } catch { return; }
  if (!dados || typeof dados !== 'object') return;
  const box = document.getElementById('midiaDireta');
  const ifr = box && box.querySelector('iframe[data-yt]');
  if (!ifr || ev.source !== ifr.contentWindow) return;
  const pl = (midiaDiretaState && midiaDiretaState.player) || {};
  if (dados.event === 'onReady') {
    // O player ficou pronto: reaplica o estado (comandos antes disso se perdem)
    midiaDiretaYt.pronto = true;
    midiaDiretaYt.assinatura = '';
    aplicarMidiaDiretaPlayer();
  } else if (dados.event === 'infoDelivery' && dados.info && typeof dados.info === 'object') {
    if (Number.isFinite(Number(dados.info.currentTime))) midiaDiretaYt.tempo = Number(dados.info.currentTime);
    // 1 = tocando, 3 = carregando: os dois querem dizer que o «play» pegou
    const est = Number(dados.info.playerState);
    if (est === 1 || est === 3) midiaDiretaYt.pegou = true;
  } else if (dados.event === 'onStateChange' && (Number(dados.info) === 1 || Number(dados.info) === 3)) {
    midiaDiretaYt.pegou = true;
  } else if (dados.event === 'onStateChange' && Number(dados.info) === 0) {
    // 🏁 acabou: em loop volta ao começo; senão avisa o servidor (ele pausa no fim)
    if (pl.loop === true) { comandarYtDireta(box, 'seekTo', [0, true]); comandarYtDireta(box, 'playVideo'); }
    else hubOv.send({ type: 'midiaDiretaFim' });
  }
});
// Resync barato do relógio do <video>/<audio> enquanto toca
setInterval(() => {
  const pl = midiaDiretaState && midiaDiretaState.player;
  if (pl && pl.estado === 'tocando' && midiaDiretaState.visible === true) aplicarMidiaDiretaPlayer(true);
}, 500);

function perfilAposSaida() {
  if (currentFeaturedId) return; // um destaque novo chegou no meio: ele manda
  destaqueNoAr = null;
  aplicarComPerfil(false);
}

function showFeatured(message) {
  clearTimeout(hideTimer);
  if (!message) {
    const card = featuredSlot.firstChild;
    currentFeaturedId = null;
    currentFeaturedMessage = null;
    updateFullscreenVisibility();
    renderMidiaPublico();
    if (card) {

      if (animOut === 'none') {

      } else {

        card.classList.add('fout-' + animOut);

  const newCard = buildFeatured(message);
  if (message.previa === true) newCard.classList.add('featured--previa'); // 📺 v0.103: é o exemplo local

    }, seconds * 1000);

}

// ---------- QR Codes (o principal + adicionais) ----------
const qrWidget = document.getElementById('qrWidget');
let qrList = [];

// Posicao padrao dos adicionais quando ainda nao foram arrastados no editor
const extraDefaultPos = (idx) => ({ x: 6 + idx * 5, y: 8 + idx * 5 });

// Cria (ou acha) o elemento de um widget adicional, herdando o estilo da familia
function extraWidgetElement(kind, id, buildInner) {
  let el = document.querySelector(`.widget[data-widget="${kind}"][data-instance="${id}"]`);
  if (!el) {
    el = document.createElement('div');
    el.className = 'widget';
    el.dataset.widget = kind;
    el.dataset.instance = id;
    el.dataset.extra = '1';
    buildInner(el);
    document.body.appendChild(el);
    if (settings) applyWidgets(); // cores/escala/animacao da familia
  }
  return el;
}

function positionExtra(el, inst, idx) {
  const baseX = TELA_V && inst.vx != null ? inst.vx : inst.x;
  const baseY = TELA_V && inst.vy != null ? inst.vy : inst.y;
  const pos = { x: baseX ?? extraDefaultPos(idx).x, y: baseY ?? extraDefaultPos(idx).y };
  // Ancora central: left no canto + translate com a meia-caixa (sem escala —
  // o zoom do elemento multiplica); applyWidgets mantem o --pos-tf em dia
  const m = obsMeiaCaixaCss(el.dataset.widget, settings, false);
  el.style.left = pos.x + '%';
  el.style.top = pos.y + '%';
  el.style.right = 'auto';
  el.style.bottom = 'auto';
  el.style.setProperty('--pos-tf', `translate(calc(${m.x} - 50%), calc(${m.y} - 50%))`);
}

// 📱 v0.139 — a pintura do QR.
// A matriz vem pronta do servidor e não muda: tudo aqui é decisão de desenho.
// O que faz um QR ser lido é o CONTRASTE entre módulo e fundo, então as cores
// passam pelo corHexOk (v0.127.1) e caem no escuro-sobre-claro se vierem
// estranhas — nunca fica um código invisível na live por causa de um valor
// torto que chegou pela rede.
const QR_FORMAS_MODULO = ['quadrado', 'arredondado', 'ponto', 'losango'];
const QR_FORMAS_OLHO = ['quadrado', 'arredondado', 'circulo'];

function estiloDoQr(conf) {
  const c = conf || {};
  const entre = (v, min, max, padrao) => {
    const n = Number(v);
    return Number.isFinite(n) ? Math.max(min, Math.min(max, n)) : padrao;
  };
  const daLista = (v, lista) => (lista.includes(v) ? v : lista[0]);
  const corModulo = corHexOk(c.qrCorModulo) || '#000000';
  return {
    modulo: daLista(c.qrModulo, QR_FORMAS_MODULO),
    olho: daLista(c.qrOlho, QR_FORMAS_OLHO),
    corModulo,
    // Os cantos só ganham cor própria quando o streamer desliga o "igual"
    corOlho: c.qrOlhoIgual === false ? (corHexOk(c.qrCorOlho) || corModulo) : corModulo,
    corFundo: corHexOk(c.qrCorFundo) || '#ffffff',
    fundoOpacidade: entre(c.qrFundoOpacidade, 0, 1, 1),
    margem: Math.round(entre(c.qrMargem, 0, 8, 2)),
    respiro: entre(c.qrRespiro, 0, 30, 0),
  };
}

// Quadrado de cantos redondos sem depender do roundRect: o navegador embutido
// do OBS nem sempre é novo o bastante para ele
function caminhoQuadradoRedondo(ctx, x, y, lado, raio) {
  const r = Math.max(0, Math.min(raio, lado / 2));
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + lado, y, x + lado, y + lado, r);
  ctx.arcTo(x + lado, y + lado, x, y + lado, r);
  ctx.arcTo(x, y + lado, x, y, r);
  ctx.arcTo(x, y, x + lado, y, r);
  ctx.closePath();
}

// Um módulo, na forma escolhida, somado ao caminho aberto
function caminhoDoModulo(ctx, x, y, lado, forma) {
  const r = lado / 2;
  if (forma === 'ponto') {
    ctx.moveTo(x + lado, y + r);
    ctx.arc(x + r, y + r, r, 0, Math.PI * 2);
    return;
  }
  if (forma === 'losango') {
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + lado, y + r);
    ctx.lineTo(x + r, y + lado);
    ctx.lineTo(x, y + r);
    ctx.closePath();
    return;
  }
  if (forma === 'arredondado') { caminhoQuadradoRedondo(ctx, x, y, lado, lado * 0.3); return; }
  ctx.rect(x, y, lado, lado);
}

// Um dos três cantos: o anel de 7×7 (com o miolo vazado pelo evenodd, para o
// fundo transparente continuar transparente) e o quadradinho 3×3 do meio
function desenharOlhoDoQr(ctx, x, y, lado, forma, cor) {
  const m = lado / 7; // um módulo
  ctx.fillStyle = cor;
  ctx.beginPath();
  if (forma === 'circulo') {
    ctx.moveTo(x + lado, y + lado / 2);
    ctx.arc(x + lado / 2, y + lado / 2, lado / 2, 0, Math.PI * 2);
    ctx.moveTo(x + lado - m, y + lado / 2);
    ctx.arc(x + lado / 2, y + lado / 2, lado / 2 - m, 0, Math.PI * 2);
  } else if (forma === 'arredondado') {
    caminhoQuadradoRedondo(ctx, x, y, lado, m * 2);
    caminhoQuadradoRedondo(ctx, x + m, y + m, lado - m * 2, m * 1.4);
  } else {
    ctx.rect(x, y, lado, lado);
    ctx.rect(x + m, y + m, lado - m * 2, lado - m * 2);
  }
  ctx.fill('evenodd');
  const l3 = m * 3, x3 = x + m * 2, y3 = y + m * 2;
  ctx.beginPath();
  if (forma === 'circulo') {
    ctx.moveTo(x3 + l3, y3 + l3 / 2);
    ctx.arc(x3 + l3 / 2, y3 + l3 / 2, l3 / 2, 0, Math.PI * 2);
  } else if (forma === 'arredondado') {
    caminhoQuadradoRedondo(ctx, x3, y3, l3, m);
  } else {
    ctx.rect(x3, y3, l3, l3);
  }
  ctx.fill();
}

function drawQrCanvas(canvas, qr, conf) {
  const e = estiloDoQr(conf);
  const count = qr.matrix.length;
  const scale = Math.max(2, Math.floor(200 / count));
  const size = count * scale;
  const margin = scale * e.margem;
  canvas.width = size + margin * 2;
  canvas.height = size + margin * 2;
  const ctx = canvas.getContext('2d');
  // Começa limpo: sem fundo pintado, o cenário da live aparece atrás
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (e.fundoOpacidade > 0) {
    ctx.save();
    ctx.globalAlpha = e.fundoOpacidade;
    ctx.fillStyle = e.corFundo;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.restore();
  }
  // Os três cantos têm forma e cor próprias: saem do laço dos módulos
  const ehOlho = (r, c) => (r < 7 && c < 7) || (r < 7 && c >= count - 7) || (r >= count - 7 && c < 7);
  const folga = scale * (e.respiro / 100);
  const lado = Math.max(1, scale - folga);
  ctx.fillStyle = e.corModulo;
  ctx.beginPath();
  for (let r = 0; r < count; r++) {
    for (let c = 0; c < count; c++) {
      if (qr.matrix[r][c] !== '1' || ehOlho(r, c)) continue;
      caminhoDoModulo(ctx, margin + c * scale + folga / 2, margin + r * scale + folga / 2, lado, e.modulo);
    }
  }
  ctx.fill();
  for (const [r, c] of [[0, 0], [0, count - 7], [count - 7, 0]]) {
    desenharOlhoDoQr(ctx, margin + c * scale, margin + r * scale, scale * 7, e.olho, e.corOlho);
  }
}

function updateQrElement(el, qr) {
  if (!qr.visible || !Array.isArray(qr.matrix)) {
    hideWidgetEl(el, 'qr');
    return;
  }
  // confFor já funde a família com o estilo próprio do adicional
  drawQrCanvas(el.querySelector('canvas'), qr, confFor(el));
  const nameEl = el.querySelector('.qr-name');
  nameEl.textContent = qr.name || '';
  nameEl.style.display = qr.name ? '' : 'none';
  showWidgetEl(el, 'qr');
}

function showQrs(qrs) {
  if (Array.isArray(qrs)) qrList = qrs;
  if (settings) applyWidgets(); // reaplica estilos (adicionais podem ter mudado)
  // Remove adicionais que nao existem mais
  for (const el of document.querySelectorAll('.widget[data-widget="qr"][data-extra]')) {
    if (!qrList.some((q, i) => i > 0 && q.id === el.dataset.instance)) el.remove();
  }
  qrList.forEach((qr, idx) => {
    let el;

// ---------- 🕐 Relógio / cronômetro / timer ----------
const relogioEl = document.getElementById('relogioWidget');
document.getElementById('somBloqueadoOv').onclick = () => {
  OBS_SOM.liberar();
  document.getElementById('somBloqueadoOv').classList.remove('mostrar');
};
let relogioAtual = null;
let relogioDeltaOv = 0;
let relogioBaseOv = { cron: 0, restante: 0, em: Date.now() };

function fusoOverlay() {
  const f = settings?.relogio?.fuso;
  return (f && f !== 'auto') ? f : undefined;
}
function fmtTempoOv(ms, comDecimos) {
  const total = Math.max(0, ms);
  const dias = Math.floor(total / 86400000); // v0.80: o timer aceita dias
  const h = Math.floor(total / 3600000) % 24;
  const m = Math.floor(total / 60000) % 60;
  const sec = Math.floor(total / 1000) % 60;
  // O cronômetro mostra o décimo de segundo, igual ao do painel
  const dec = comDecimos && dias === 0 ? '.' + Math.floor((total % 1000) / 100) : '';
  if (dias > 0) return `${dias}d ${h}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
  return h > 0
    ? `${h}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}${dec}`
    : `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}${dec}`;
}

// v0.80: os três instrumentos são independentes — qualquer combinação pode
// estar na tela ao mesmo tempo, empilhada dentro do mesmo widget
function algumRelogioVisivel() {
  return !!(relogioAtual && (relogioAtual.relogio?.visible
    || relogioAtual.cronometro?.visible || relogioAtual.timer?.visible));
}
function showRelogio(relogio) {
  if (relogio) {
    relogioAtual = relogio;
    relogioDeltaOv = relogio.agora - Date.now();
    relogioBaseOv = {
      cron: relogio.cronometro?.corrido || 0,
      restante: relogio.timer?.restante || 0,
      em: Date.now(),
    };
  }
  if (!algumRelogioVisivel()) {
    if (!PREVIA) {
      hideWidgetEl(relogioEl, 'relogio');
      return;
    }
    // 📺 v0.103: na prévia do editor o relógio desligado mostra a hora, de exemplo
    relogioAtual = { ...(relogioAtual || { cronometro: {}, timer: {} }), relogio: { visible: true } };
  }
  pintarRelogioOverlay();
  showWidgetEl(relogioEl, 'relogio');
}

function tempoCronOv() {
  const passado = relogioAtual?.cronometro?.rodando ? Date.now() - relogioBaseOv.em : 0;
  return relogioBaseOv.cron + passado;
}
function tempoTimerOv() {
  const passado = relogioAtual?.timer?.rodando ? Date.now() - relogioBaseOv.em : 0;
  return Math.max(0, relogioBaseOv.restante - passado);
}

function pintarRelogioOverlay() {
  if (!algumRelogioVisivel()) return;
  const conf = settings?.widgets?.relogio || {};
  relogioEl.innerHTML = '';

  const bloco = (principal, rotulo, classeSub, classeHora) => {
    const hora = document.createElement('div');
    hora.className = 'rl-hora' + (classeHora ? ' ' + classeHora : '');
    hora.textContent = principal;
    relogioEl.appendChild(hora);
    if (rotulo) {
      const sub = document.createElement('div');
      sub.className = classeSub;
      sub.textContent = rotulo;
      relogioEl.appendChild(sub);
    }
  };
  let acabou = false;
  if (relogioAtual.relogio?.visible) {
    const d = new Date(Date.now() + relogioDeltaOv);
    const opcoes = { hour: '2-digit', minute: '2-digit', hour12: conf.formato24h === false, timeZone: fusoOverlay() };
    if (conf.mostrarSegundos !== false) opcoes.second = '2-digit';
    const data = conf.mostrarData !== false
      ? d.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long', timeZone: fusoOverlay() })
      : '';
    bloco(d.toLocaleTimeString('pt-BR', opcoes), data, 'rl-data');
  }
  if (relogioAtual.cronometro?.visible) {
    bloco(fmtTempoOv(tempoCronOv(), conf.mostrarDecimos !== false),
      conf.mostrarRotulo !== false ? 'Cronômetro' : '', 'rl-rotulo');
  }
  if (relogioAtual.timer?.visible) {
    const ms = tempoTimerOv();
    acabou = ms === 0;
    bloco(fmtTempoOv(ms, false), conf.mostrarRotulo !== false ? 'Timer' : '', 'rl-rotulo', 'rl-timer');
  }
  relogioEl.style.setProperty('--rl-size', (Number(conf.fontSize) || 44) + 'px');
  relogioEl.style.setProperty('--rl-font', conf.fontFamily ? `'${String(conf.fontFamily).replace(/['"\\]/g, '')}', 'Segoe UI', sans-serif` : 'inherit');
  relogioEl.classList.toggle('rl-negrito', conf.bold !== false);
  const confRel = settings?.relogio || {};
  relogioEl.style.setProperty('--rl-cor-final', confRel.piscarFinalCor || '#ffd23f');
  relogioEl.style.setProperty('--rl-cor-fim', confRel.piscarNoFimCor || '#ff5c5c');
  relogioEl.classList.toggle('rl-fim', relogioAtual.timer?.visible && noFimOv(acabou && !relogioAtual.timer.rodando));
  relogioEl.classList.toggle('rl-final10', naRetaOv());
}

// ⏳ Reta final: os últimos segundos antes de o timer acabar.
// Quantos segundos e se vale para o número ou para o Aviso saem das
// configurações — cada um tem o seu tempo.
function faltamOv() {
  if (!relogioAtual?.timer?.rodando) return -1;
  const passado = Date.now() - relogioBaseOv.em;
  return Math.max(0, relogioBaseOv.restante - passado);
}
function segundosDaReta(valor, padrao) {
  const n = Number(valor);
  return (Number.isFinite(n) ? Math.max(1, Math.min(60, n)) : padrao) * 1000;
}
function naRetaOv() {
  const conf = settings?.relogio || {};
  if (conf.piscarFinal === false) return false;
  const faltam = faltamOv();
  return faltam > 0 && faltam <= segundosDaReta(conf.piscarFinalSegundos, 10);
}
// 🔴 A piscada do fim pode parar sozinha depois de alguns segundos
function noFimOv(zerado) {
  const conf = settings?.relogio || {};
  if (!zerado || conf.piscarNoFim === false) return false;
  const limite = Number(conf.piscarNoFimSegundos);
  if (!Number.isFinite(limite) || limite <= 0) return true; // 0 = pisca sem parar
  const desde = Number(relogioAtual?.timer?.tocouFim) || 0;
  if (!desde) return true;
  return (Date.now() + relogioDeltaOv) - desde < Math.min(300, limite) * 1000;
}
// 🎵 Mesa de trilhas (Labs): o overlay é quem põe a música NA LIVE — ele é
// uma fonte de navegador do OBS, então o áudio dele entra na transmissão,
// no mesmo mixer das outras fontes. Só toca o que tem destino live/ambos.
let trilhasOv = [];
function tocarTrilhaNaLive(id, desde) {
  if (settings?.labs?.trilhas !== true) return;
  const t = trilhasOv.find((x) => x && x.id === id);
  if (!t || !t.url) return;
  const solo = t.modo === 'solo' || t.modo === 'loop' || !t.modo;
  if (t.destino === 'painel') {
    // Só para os ouvidos do streamer — mas se for a trilha de BASE, a live
    // cala a antiga (a base é uma só, em todas as telas)
    if (solo && TRILHA_PLAYER.tocando()) TRILHA_PLAYER.parar();
    return;
  }
  TRILHA_PLAYER.tocar(t, desde);
}
// Num navegador comum (fora do OBS), trilha presa por falta de toque também
// acende o convite 🔇 — dentro do OBS toca direto
TRILHA_PLAYER.quandoBloquear((preso) => {
  const convite = document.getElementById('somBloqueadoOv');
  if (convite && preso && !window.obsstudio) convite.classList.add('mostrar');
  if (convite && !preso && !OBS_SOM.estaBloqueado()) convite.classList.remove('mostrar');
});

// 🔊 Alerta do fim do timer NA LIVE: o overlay é uma fonte do OBS, então
// o som entra no áudio da transmissão (quem assiste também ouve).
// v0.155: o som mora só em «🔊 Áudios dos overlays» (🕐 Relógio → 🏁
// Finalização). O caminho antigo (relogio.somUrl) saiu — e com ele o toque
// em dobro de quem tinha os dois configurados.
function tocarSomNaLive() {
  dispararFimOv('relogio');
}

// Dentro do OBS o som toca sozinho. Num navegador comum (celular, tablet,
// outro PC), é preciso um toque na tela antes — então deixamos tudo pronto
// e, se ainda assim estiver bloqueado, convidamos a pessoa a tocar uma vez.
function prepararSomNaLive() {
  // Qualquer som dos overlays que toque na live serve de chave: destravar
  // um já destrava todos os outros (v0.155)
  const chave = obsPrimeiroSomOv(settings?.audiosOverlay, (s) => s.onde !== 'painel');
  if (!chave) return;

    convite.classList.toggle('mostrar', precisa);

// ⏳ Contagem final: nos 10 segundos que faltam, o Aviso pisca suavemente
// para o público perceber que o tempo está acabando. Vale mesmo com o
// relógio fora da tela — quem manda é o timer, não o widget.
// ⏰ v0.80: nos mesmos moldes, o Aviso também pisca quando está chegando a
// data/hora do «sumir pelo relógio» ou o tempo do «sumir pelo timer».
let fmtPartesOv = { fuso: '§', f: null }; // formatador com fuso, reaproveitado
function partesNoFusoOv(d) {
  const fuso = fusoOverlay() || '';
  if (fmtPartesOv.fuso !== fuso) {
    try {
      fmtPartesOv = {
        fuso,
        f: new Intl.DateTimeFormat('en-GB', {
          timeZone: fuso || undefined, day: '2-digit', month: '2-digit', year: 'numeric',
          hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23',
        }),
      };
    } catch { fmtPartesOv = { fuso, f: null }; }
  }
  if (!fmtPartesOv.f) {
    return { dia: d.getDate(), mes: d.getMonth() + 1, ano: d.getFullYear(), hora: d.getHours(), min: d.getMinutes(), seg: d.getSeconds() };
  }
  const g = {};
  for (const p of fmtPartesOv.f.formatToParts(d)) g[p.type] = p.value;
  return { dia: +g.day, mes: +g.month, ano: +g.year, hora: +g.hour, min: +g.minute, seg: +g.second };
}
// Quantos ms faltam para o relógio bater com os campos preenchidos do
// «sumir sozinho» (procura só na próxima janela de ~70s; -1 = longe/desligado)
// 📢 v0.128: cada instância tem o seu «sumir» — o cache da busca é por instância
const avisoRelCache = new Map(); // id → { em, valor }
function avisoRelogioFaltamMs(inst) {
  const alvo = inst?.sumir?.relogio;
  if (!alvo || !Object.values(alvo).some((v) => v > 0)) return -1;
  const chave = inst.id || 'principal';
  const cache = avisoRelCache.get(chave);
  if (cache && Date.now() - cache.em < 900) {
    // reusa a busca por até 1s, descontando o que já passou
    return cache.valor < 0 ? -1 : Math.max(0, cache.valor - (Date.now() - cache.em));
  }
  let valor = -1;
  for (let k = 0; k <= 70; k++) {
    const g = partesNoFusoOv(new Date(Date.now() + relogioDeltaOv + k * 1000));
    const bate = Object.entries(alvo).every(([campo, v]) => !(v > 0) || g[campo] === v);
    if (bate) { valor = k * 1000; break; }
  }
  avisoRelCache.set(chave, { em: Date.now(), valor });
  return valor;
}
function msDoSumirTimerOv(t) {
  if (!t) return 0;
  return ((Number(t.dias) || 0) * 86400 + (Number(t.horas) || 0) * 3600
    + (Number(t.min) || 0) * 60 + (Number(t.seg) || 0)) * 1000;
}
function atualizarContagemDoAviso() {
  if (!avisoEl) return;
  const conf = settings?.relogio || {};
  const cor = String(conf.piscarAvisoCor || '').trim();
  const pisca = conf.piscarAvisoNoFinal !== false;
  const reta = pisca ? segundosDaReta(conf.piscarAvisoSegundos, 10) : 0;
  const faltam = pisca ? faltamOv() : -1;
  // 📢 v0.128: cada aviso na tela (principal e adicionais) pisca pelo SEU «sumir»
  for (const el of document.querySelectorAll('.widget[data-widget="aviso"]')) {
    const inst = avisoInstanciaDoEl(el);
    let piscando = false;
    if (pisca) {
      piscando = faltam > 0 && faltam <= reta;
      // «sumir pelo timer»: pisca quando o restante se aproxima do tempo marcado
      const alvoTimer = msDoSumirTimerOv(inst?.sumir?.timer);
      if (!piscando && alvoTimer > 0 && faltam >= 0) {
        const ate = faltam - alvoTimer;
        piscando = ate > 0 && ate <= reta;
      }
      // «sumir pelo relógio»: pisca quando a data/hora marcada está chegando
      if (!piscando) {
        const ate = avisoRelogioFaltamMs(inst);
        piscando = ate > 0 && ate <= reta;
      }
    }
    el.style.setProperty('--av-cor-pisca', cor || '#ffd23f');
    el.classList.toggle('av-cor', !!cor);
    el.classList.toggle('av-contagem', piscando && el.classList.contains('visible'));
  }
}

// Monta o par logo+numero com o numero do lado escolhido pelo usuario:
// direita, esquerda, em cima ou embaixo da logo.
function arrangeAudPair(container, logoEl, countEl) {
  const side = settings?.widgets?.audience?.numbersSide || 'right';
  container.style.flexDirection = (side === 'top' || side === 'bottom') ? 'column' : 'row';
  container.style.alignItems = 'center';
  const countFirst = side === 'left' || side === 'top';
  container.appendChild(countFirst ? countEl : logoEl);
  container.appendChild(countFirst ? logoEl : countEl);
}

function showAudience(audience) {
  if (audience) lastAudience = audience;
  let data = lastAudience;
  if (PREVIA && (!data || !data.visible)) data = EXEMPLO_PREVIA.audience; // 📺 v0.103
  if (!data || !data.visible) {
    hideWidgetEl(audienceEl, 'audience');
    return;
  }
  const entries = Object.entries(data.platforms || {}).filter(([, info]) => Number.isFinite(info?.count));
  // Dinamico: a rede com maior audiencia aparece primeiro
  entries.sort((a, b) => b[1].count - a[1].count);
  audienceEl.innerHTML = '';
  const mode = settings?.widgets?.audience?.mode || 'perPlatform';

  if (!entries.length) {
    const empty = document.createElement('div');
    empty.className = 'aud-total';
    empty.textContent = settings?.widgets?.audience?.showIcon !== false ? '👥 —' : '—';
    audienceEl.appendChild(empty);
  } else if (mode === 'total') {
    // Soma geral: o numero fica do lado escolhido DAS LOGOS (direita,
    // esquerda, em cima ou embaixo); o icone 👥 e opcional e vive junto
    // das logos.
    const total = entries.reduce((sum, [, info]) => sum + info.count, 0);
    const totalRow = document.createElement('div');
    totalRow.className = 'aud-total';
    const icons = document.createElement('div');
    icons.className = 'aud-icons';
    if (settings?.widgets?.audience?.showIcon !== false) {
      const eye = document.createElement('span');
      eye.textContent = '👥';
      icons.appendChild(eye);
    }
    for (const [platform] of entries) icons.appendChild(platformIcon(platform));
    const count = document.createElement('span');
    count.className = 'aud-count';
    count.textContent = total.toLocaleString('pt-BR');
    arrangeAudPair(totalRow, icons, count);
    audienceEl.appendChild(totalRow);
  } else {
    // Cada plataforma com sua propria audiencia: so a logo e o numero
    const rows = document.createElement('div');
    rows.className = 'aud-rows';
    for (const [platform, info] of entries) {
      const row = document.createElement('div');
      row.className = 'aud-row';
      const count = document.createElement('span');
      count.className = 'aud-count';
      count.textContent = info.count.toLocaleString('pt-BR');
      arrangeAudPair(row, platformIcon(platform), count);
      rows.appendChild(row);
    }
    audienceEl.appendChild(rows);
  }
  showWidgetEl(audienceEl, 'audience');
}

// ---------- Sorteio ----------
const raffleEl = document.getElementById('raffleWidget');
const raffleBox = document.getElementById('raffleBox');
const MEDALS = [
  { emoji: '🥇', color: '#ffd700', label: '1º' },
  { emoji: '🥈', color: '#c0c0c0', label: '2º' },
  { emoji: '🥉', color: '#cd7f32', label: '3º' },
];
let raffleShownAt = 0;

function winnerCard(winner, place, delayMs, raffle) {
  // ☎️ v0.64: telefone não sobe ao pódio — o vencedor aparece mascarado
  winner = mensagemParaTela(winner);
  const medal = MEDALS[place];
  const card = document.createElement('div');
  card.className = 'winner' + (place === 0 ? ' first' : '');
  card.style.animationDelay = delayMs + 'ms';
  card.style.setProperty('--m-color', medal.color);

  const medalEl = document.createElement('div');
  medalEl.className = 'medal';
  medalEl.textContent = medal.emoji;
  card.appendChild(medalEl);

  const avatar = avatarElement(winner);
  avatar.classList.add('w-avatar');
  card.appendChild(avatar);

  const name = document.createElement('div');
  name.className = 'w-name';
  name.textContent = winner.author;
  card.appendChild(name);

  const platformRow = document.createElement('div');
  platformRow.className = 'w-platform';
  platformRow.appendChild(platformIcon(winner.platform, 15));
  const platformName = document.createElement('span');
  platformName.textContent = PLATFORMS[winner.platform]?.name || winner.platform;
  platformRow.appendChild(platformName);
  card.appendChild(platformRow);

  // 💬⏱ v0.50: a 1ª resposta do ganhador, o "não respondeu" e o timer da vez
  const resposta = raffle?.respostas?.[place];
  if (resposta && settings?.raffle?.respostaTela !== false) {
    const balao = document.createElement('div');
    balao.className = 'w-reply';
    balao.textContent = resposta.texto || '💬';
    card.appendChild(balao);
  } else if (raffle?.expirados?.[place]) {
    card.classList.add('perdeu');
    const tag = document.createElement('div');
    tag.className = 'w-perdeu';
    tag.textContent = '⌛ Não respondeu a tempo';
    card.appendChild(tag);
  } else if (raffle?.vez === place && raffle?.prazoAte) {
    const timer = document.createElement('div');
    timer.className = 'w-timer';
    timer.dataset.prazo = String(raffle.prazoAte);
    timer.textContent = '⏱';
    card.appendChild(timer);
  }

  return card;
}

// ⏱ Contagem viva dos timers de resposta (os 10s finais piscam em vermelho,
// como no Timer do relógio). Um relógio só atualiza todos os .w-timer.
setInterval(() => {
  for (const el of document.querySelectorAll('.w-timer[data-prazo]')) {
    const resta = Math.max(0, Math.ceil((Number(el.dataset.prazo) - Date.now()) / 1000));
    const m = Math.floor(resta / 60);
    const s = resta % 60;
    el.textContent = '⏱ ' + (m ? `${m}:${String(s).padStart(2, '0')}` : `${s}s`);
    el.classList.toggle('final10', resta <= 10);
  }
}, 250);

// 🎲 Tempo do dado na tela: das configurações (0 = vai direto para o pódio)
function tempoDoDado() {
  const n = Number(settings?.raffle?.dadoSegundos);
  if (!Number.isFinite(n)) return 3000;
  return Math.max(0, Math.min(15, n)) * 1000;
}

// 🔊 Som do dado NA LIVE (mesma regra do alerta do timer): v0.155, só pelo
// card «🔊 Áudios dos overlays» (🎁 Sorteio → 🏁 Finalização)
function tocarSomDoDado() {
  dispararFimOv('raffle');
}

// 🎲 O suspense do dado sobrevive a updates: um broadcast no meio do giro
// (uma resposta capturada, por exemplo) não pode nem revelar o pódio antes
// da hora nem deixar um setTimeout órfão duplicando o pódio depois.
let raffleRevealTimer = null; // o reveal agendado do sorteio atual
let raffleRevealAte = 0;      // epoch ms de quando o dado do sorteio atual acaba
let raffleRevelado = 0;       // drawnAt do último pódio efetivamente revelado
function showRaffle(raffle, animateNew) {
  if (raffleRevealTimer) { clearTimeout(raffleRevealTimer); raffleRevealTimer = null; }
  // 📺 v0.103: na prévia do editor, sem sorteio no ar, o pódio de exemplo (já revelado)
  if (PREVIA && (!raffle || !raffle.visible || !raffle.winners?.length)) { raffle = EXEMPLO_PREVIA.raffle; animateNew = false; }
  if (!raffle || !raffle.visible || !raffle.winners?.length) {
    hideWidgetEl(raffleEl, 'raffle');
    return;
  }
  showWidgetEl(raffleEl, 'raffle');
  raffleBox.innerHTML = '';
  // Pódio que JÁ foi revelado (só chegou resposta/timer): aparece pronto
  const jaRevelado = raffle.drawnAt === raffleRevelado;

  const title = document.createElement('div');
  title.className = 'raffle-title';
  title.textContent = '🎁 SORTEIO';
  raffleBox.appendChild(title);

  const reveal = () => {
    raffleRevealTimer = null;
    raffleRevelado = raffle.drawnAt || 0;
    const spinner = raffleBox.querySelector('.raffle-spinner');
    if (spinner) spinner.remove();
    const podium = document.createElement('div');
    const vertical = (settings?.widgets?.raffle?.layout || 'vertical') === 'vertical';
    podium.className = 'podium' + (vertical ? ' vertical' : '');
    // Vertical: 1º, 2º, 3º um embaixo do outro. Horizontal: 2º, 1º, 3º (1º no meio).
    const order = vertical || raffle.winners.length < 3
      ? raffle.winners.map((_, i) => i)
      : [1, 0, 2];
    let delay = 0;
    for (const place of order) {
      if (!raffle.winners[place]) continue;
      const cardDelay = vertical ? (delay += 300) - 300 : (place === 0 ? 900 : delay += 300);
      const card = winnerCard(raffle.winners[place], place, cardDelay, raffle);
      if (jaRevelado) card.classList.add('sem-anim');
      podium.appendChild(card);
    }
    raffleBox.appendChild(podium);
  };

  // 🎲 Quanto tempo o dado roda antes do pódio (configurável; 0 = direto)
  if (raffle.drawnAt !== raffleShownAt) {
    // Sorteio NOVO: o dado começa agora (só com animação; no init vai direto)
    raffleShownAt = raffle.drawnAt || 0;
    const dadoMs = tempoDoDado();
    raffleRevealAte = animateNew && dadoMs > 0 ? Date.now() + dadoMs : 0;
    if (raffleRevealAte) tocarSomDoDado();
  }
  const resta = raffleRevealAte - Date.now();
  if (!jaRevelado && resta > 60) {
    // O dado ainda está girando: mantém (ou remonta) o 🎲 e reagenda o reveal
    const spinner = document.createElement('div');
    spinner.className = 'raffle-spinner';
    spinner.textContent = '🎲';
    raffleBox.appendChild(spinner);
    raffleRevealTimer = setTimeout(reveal, resta);
  } else {
    reveal();
  }
}

// ---------- 🔊 v0.77: áudios dos overlays (entrada/saída/tempo/fim) ----------
// O overlay é quem VÊ a tela: um vigia percebe cada widget aparecendo e
// sumindo, toca a parte dele aqui (o OBS captura) e avisa o servidor para o
// painel tocar a dele. Na prévia do editor (iframe) o motor fica mudo.
const AUDIO_OV_EM_PREVIA = (() => { try { return window.self !== window.top; } catch { return true; } })();
const motorAudioOv = criarMotorAudioOv((chave, momento) => {
  const c = settings?.audiosOverlay?.[chave]?.[momento];
  return (c && c.onde !== 'painel') ? c : null;
});
const audioOvNoPainel = (chave, momento) => {
  const c = settings?.audiosOverlay?.[chave]?.[momento];
  return !!(c && c.url && c.onde !== 'overlay');
};
// 🏁 A finalização (o timer zerando, o sorteio revelando) toca AQUI a parte
// da live. A parte do painel NÃO é repassada: o painel enxerga o mesmo
// evento e toca a dele sozinho — assim ela toca uma vez só, com ou sem
// overlay aberto, e sem depender de qual tela viu primeiro (v0.155)
function dispararFimOv(chave) {
  if (AUDIO_OV_EM_PREVIA) return;
  motorAudioOv.tocar(chave, 'fim');
}
const elOvVisivel = (id) => {
  const el = document.getElementById(id);
  return !!el && getComputedStyle(el).display !== 'none';
};
const VISORES_OV = {
  featured: () => !!featuredSlot.querySelector('.featured'),
  midia: () => document.getElementById('midiaPublico').classList.contains('on')
    || !!featuredSlot.querySelector('.audio-player'),
  qr: () => elOvVisivel('qrWidget'),
  raffle: () => elOvVisivel('raffleWidget'),
  likemeter: () => elOvVisivel('likemeter'),
  audience: () => elOvVisivel('audienceWidget'),
  winstreak: () => elOvVisivel('winstreak'),
  aviso: () => elOvVisivel('avisoWidget'),
  relogio: () => elOvVisivel('relogioWidget'),
};
const presencaOvAtual = new Map();
setInterval(() => {
  if (!settings || AUDIO_OV_EM_PREVIA) return;
  for (const [chave, ver] of Object.entries(VISORES_OV)) {
    let visivel = false;
    try { visivel = !!ver(); } catch { /* widget ainda montando */ }
    const antes = presencaOvAtual.get(chave);
    if (antes === undefined) { presencaOvAtual.set(chave, visivel); continue; } // 1ª leitura: sem tocar
    if (visivel === antes) continue;
    presencaOvAtual.set(chave, visivel);
    motorAudioOv.presenca(chave, visivel);
    // avisa o painel: os momentos que tocam lá — e a saída SEMPRE que algo
    // do widget toca no painel (para calar os loops de entrada/tempo)
    if (visivel) {
      for (const momento of ['entrada', 'tempo']) {
        if (audioOvNoPainel(chave, momento)) hubOv.send({ type: 'audioOverlayMomento', chave, momento });
      }
    } else if (['entrada', 'tempo', 'saida'].some((m) => audioOvNoPainel(chave, m))) {
      hubOv.send({ type: 'audioOverlayMomento', chave, momento: 'saida' });
    }
  }
}, 400);

const hubOv = connectHub((event) => {
  switch (event.type) {
    case 'init':
      // 🔄 v0.75.1: o programa foi ATUALIZADO com esta tela aberta (fonte
      // do OBS ou aba do navegador): a versão do servidor mudou desde o
      // carregamento — recarrega para rodar o código novo (senão recursos
      // novos não aparecem, ex.: figurinha animada virando 📎 arquivo)
      if (!window.versaoDoPrograma) window.versaoDoPrograma = event.version || 'x';
      else if (event.version && window.versaoDoPrograma !== event.version) { location.reload(); break; }
      settingsBase = event.settings;
      perfisOverlay = Array.isArray(event.perfisOverlay) ? event.perfisOverlay : [];
      destaqueReal = event.featured || null;
      // 🎙️ v0.140: a fala do que já está no ar chega junto (a tela pode ter
      // sido aberta bem depois de a transcrição ficar pronta)
      guardarTranscricao(event.transcricaoDestaque);
      if (Array.isArray(event.exemploQr)) exemploQrPrevia = event.exemploQr; // 📺 v0.103
      destaqueNoAr = destaqueParaMostrar(); // 📺 na prévia, sem nada no ar, é o exemplo
      if (event.midiaPlayer) midiaPlayerState = event.midiaPlayer; // 🎛️ antes do cartão montar
      aplicarComPerfil(true);
      showFeatured(destaqueNoAr);
      showAvatarZoom(event.avatarZoom);
      showAvatarZooms(event.avatarZooms || []);
      showQrs(event.qrs);
      showLikemeter(event.likemeter);
      showRaffle(event.raffle, false);
      showWinstreaks(event.winstreaks);
      showAudience(event.audience);
      showAvisos(event.avisos || [event.aviso]); // 📢 v0.128: lista (ou o formato antigo)
      showRelogio(event.relogio);
      prepararSomNaLive();
      trilhasOv = Array.isArray(event.trilhas) ? event.trilhas : [];
      // Quem abre no meio de uma trilha entra tocando junto (sincronizado)
      if (event.trilhaTocando) tocarTrilhaNaLive(event.trilhaTocando.id, event.trilhaTocando.desde);
      // 🖼️🎞️ v0.86: mídia de tecla que já estava na tela entra junto
      trilhaTelaAtual = event.trilhaTela || null;
      renderMidiaTrilha();
      // 🎞️ v0.129: mídia direta que já estava na tela entra junto (servidor
      // antigo não manda o campo → nada na tela)
      midiaDiretaState = event.midiaDireta || null;
      renderMidiaDireta();
      aplicarMidiaDiretaPlayer();
      break;
    case 'settings':
      settingsBase = event.settings;
      aplicarComPerfil(true);
      showAudience(null); // re-renderiza com o modo novo
      showAvisos(null);    // idem para os avisos (fonte, cores, tamanho)
      showRelogio(null);
      showQrs(null);       // 📱 v0.139: o código é repintado com o estilo novo
      prepararSomNaLive();
      // 🎵 Desligar o Labs das trilhas cala a live na hora
      if (settings?.labs?.trilhas !== true) TRILHA_PLAYER.parar();
      renderMidiaTrilha(); // ✨ sombra nova / Labs desligado saem na hora
      renderMidiaDireta(); // 🎞️ v0.129: idem para a mídia direta
      break;
    case 'midiaDireta':
      // 🎞️ v0.129: o painel comanda a mídia direta (mostrar/esconder, escala,
      // tela cheia e o player) — o overlay só espelha
      midiaDiretaState = event.midiaDireta || null;
      renderMidiaDireta();
      aplicarMidiaDiretaPlayer();
      break;
    case 'trilhas':
      trilhasOv = Array.isArray(event.trilhas) ? event.trilhas : [];
      break;
    case 'trilhaPlay':
      tocarTrilhaNaLive(event.id, event.desde);
      break;
    case 'trilhaStop':
      TRILHA_PLAYER.parar();
      break;
    case 'trilhaTela':
      // 🖼️🎞️ v0.86: a mídia da tecla entra/sai da tela do público
      trilhaTelaAtual = event.tela || null;
      renderMidiaTrilha();
      break;
    case 'featured':
      destaqueReal = event.featured || null;
      guardarTranscricao(event.transcricaoDestaque); // 🎙️ v0.140: antes de montar o cartão
      if (event.featured) {
        // 🎭 Primeiro o molde certo, depois o cartão — tudo no mesmo tick
        destaqueNoAr = event.featured;
        aplicarComPerfil(false);
        showFeatured(event.featured);
      } else if (PREVIA && exemploPrevia) {
        // 📺 v0.103: na prévia do editor, saiu o de verdade, volta o exemplo
        mostrarDestaqueAtual();
      } else {
        // Tirou do ar: o cartão sai com a roupa que estava; o molde só
        // devolve o visual de sempre depois da animação (perfilAposSaida)
        showFeatured(null);
      }
      break;
    // 🖼️ v0.138: a foto do autor foi descoberta depois que o comentário já
    // estava no ar. O cartão NÃO é remontado (a animação de entrada e a mídia
    // tocando continuam) — só as iniciais viram foto, aqui e no pódio 🎁.
    case 'avatarFix': {
      const chave = String(event.login || '').toLowerCase();
      if (!chave || !avatarUrlOk(event.avatar)) break;
      const combina = (m) => !!m && m.platform === event.platform && !m.avatar
        && (String(m.authorLogin || '').toLowerCase() === chave || String(m.author || '').toLowerCase() === chave);
      // guardado também no modelo: se o cartão for remontado (troca de molde,
      // mudança de ajuste), ele já nasce com a foto
      if (combina(currentFeaturedMessage)) currentFeaturedMessage.avatar = event.avatar;
      if (combina(destaqueReal)) destaqueReal.avatar = event.avatar;
      if (combina(destaqueNoAr)) destaqueNoAr.avatar = event.avatar;
      aplicarFotoQueChegou(document.body, event.platform, chave, event.avatar);
      break;
    }
    // 🎙️ v0.140: a transcrição ficou pronta com o áudio/vídeo já na tela —
    // a região do comentário troca a marca pela fala sem remontar o cartão
    case 'transcricao':
      guardarTranscricao(event);
      aplicarTranscricaoQueChegou(event.url);
      break;
    // 🎛️ v0.71: o painel comanda o player da mídia na tela
    case 'midiaPlayer':
      midiaPlayerState = event.player || midiaPlayerState;
      aplicarMidiaPlayer();
      break;
    case 'perfisOverlay':
      perfisOverlay = Array.isArray(event.perfis) ? event.perfis : [];
      aplicarComPerfil(false);
      break;
    case 'avatarZooms':
      showAvatarZooms(event.lista);
      break;
    case 'avatarZoom':
      showAvatarZoom(event.avatarZoom);
      break;
    case 'qr':
      showQrs(event.qrs);
      break;
    case 'likemeter':
      showLikemeter(event.likemeter);
      break;
    case 'raffle':
      showRaffle(event.raffle, true);
      break;
    case 'winstreak':
      showWinstreaks(event.winstreaks);
      break;
    case 'aviso':
      showAvisos(event.avisos || [event.aviso]); // 📢 v0.128: lista (ou o formato antigo)
      break;
    case 'relogio':
      showRelogio(event.relogio);
      if (event.fim) tocarSomNaLive();
      break;
    case 'audience':
      showAudience(event.audience);
      break;
  }
});
</script>
